<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrova</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070b12;
  --card:#0e151f;
  --card2:#121c28;
  --border:#1d2a3b;
  --text:#f5f7fa;
  --muted:#8996a8;
  --blue:#1683ff;
  --blue-dark:#0d6fe0;
  --green:#35c978;
  --red:#ff5667;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh;display:flex;padding-bottom:88px}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:245px;
  background:#080d14;
  border-right:1px solid var(--border);
  padding:22px 15px;
  z-index:50;
  overflow:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:800;
  padding:5px 10px 28px;
}
.logo-mark{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  background:var(--blue);
  border-radius:10px;
}

.nav-title{
  color:#5f6d80;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  padding:13px 10px 7px;
}
.nav button{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  border:0;
  background:transparent;
  color:#aeb8c6;
  padding:12px 11px;
  border-radius:10px;
  margin:2px 0;
  text-align:left;
}
.nav button:hover,
.nav button.active{
  color:white;
  background:#121d2a;
}
.nav-icon{
  width:20px;
  text-align:center;
  font-size:18px;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
}

.topbar{
  height:76px;
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 28px;
  background:rgba(7,11,18,.94);
  border-bottom:1px solid rgba(255,255,255,.04);
  backdrop-filter:blur(14px);
}

.search{
  position:relative;
  width:min(620px,100%);
}
.search input{
  width:100%;
  padding:13px 18px 13px 44px;
  border-radius:25px;
  border:1px solid var(--border);
  background:#111925;
  color:white;
  outline:none;
}
.search input:focus{border-color:var(--blue)}
.search-symbol{
  position:absolute;
  left:17px;
  top:11px;
  color:#8c9bad;
  font-size:20px;
}

.account-button{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:9px;
  padding:6px 12px 6px 6px;
  border:1px solid var(--border);
  border-radius:25px;
  background:#101823;
  color:white;
}
.avatar{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#164475;
  font-weight:800;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{padding:28px}

.hero{
  min-height:290px;
  display:flex;
  align-items:flex-end;
  padding:38px;
  border-radius:22px;
  border:1px solid #173555;
  background:
    radial-gradient(circle at 80% 30%,rgba(22,131,255,.42),transparent 34%),
    linear-gradient(135deg,#102d4e,#09131f 65%,#071019);
}
.hero-small{
  color:#65b4ff;
  font-weight:800;
  letter-spacing:.8px;
}
.hero h1{
  font-size:44px;
  line-height:1.04;
  margin:9px 0;
}
.hero p{
  max-width:560px;
  color:#aab7c6;
  line-height:1.6;
}

.primary{
  border:0;
  background:var(--blue);
  color:white;
  padding:12px 20px;
  border-radius:25px;
  font-weight:800;
}
.primary:hover{background:#3195ff}

.secondary{
  border:1px solid #293a50;
  background:#151f2d;
  color:white;
  padding:11px 18px;
  border-radius:24px;
}

.danger{
  border:1px solid #622a35;
  background:#28141a;
  color:#ff9da8;
  padding:10px 15px;
  border-radius:10px;
}

.page-title{
  margin:0 0 7px;
  font-size:31px;
}
.page-sub{
  color:var(--muted);
  margin:0 0 25px;
}

.section{margin-top:30px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.section h2{margin:0;font-size:21px}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:16px;
}

.card{
  padding:12px;
  background:#0c131d;
  border:1px solid #182638;
  border-radius:15px;
  transition:.18s;
}
.card:hover{
  transform:translateY(-2px);
  border-color:#29415d;
}
.cover{
  width:100%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:11px;
  background:linear-gradient(135deg,#153a61,#09111c);
  margin-bottom:12px;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.cover-letter{
  font-size:42px;
  font-weight:900;
  color:#4da5ff;
}
.card-title{
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.song-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:9px;
  border-radius:11px;
}
.song-row:hover{background:#101a26}
.song-cover{
  width:50px;
  height:50px;
  flex:none;
  overflow:hidden;
  border-radius:8px;
  background:#142337;
  display:grid;
  place-items:center;
  font-weight:800;
}
.song-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.song-info{
  min-width:0;
  flex:1;
}
.song-title{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.song-artist{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}
.circle{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid #293a50;
  background:#121d2a;
  color:white;
}
.circle:hover{background:var(--blue)}

.empty{
  padding:42px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #2a394c;
  border-radius:13px;
}

.auth-wrap{
  min-height:calc(100vh - 76px);
  display:grid;
  place-items:center;
}
.auth-box{
  width:min(460px,100%);
  background:#0d151f;
  border:1px solid #203047;
  border-radius:20px;
  padding:30px;
}
.auth-box h1{margin-top:0}

.field{margin-bottom:15px}
.field label{
  display:block;
  color:#b9c5d3;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #26364b;
  background:#080e17;
  color:white;
  outline:none;
}
.field textarea{
  min-height:110px;
  resize:vertical;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
}

.link{
  border:0;
  background:transparent;
  color:#54aaff;
  padding:0;
}

.notice{
  padding:13px 15px;
  border-radius:10px;
  background:#0d2135;
  border:1px solid #1c4d78;
  color:#add7ff;
  margin-bottom:15px;
}
.error{
  padding:13px 15px;
  border-radius:10px;
  background:#29151b;
  border:1px solid #632933;
  color:#ffb0b8;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:13px;
}
.stat{
  padding:18px;
  border-radius:14px;
  background:#0a111a;
  border:1px solid #1b2a3d;
}
.stat-number{
  font-size:27px;
  font-weight:900;
}
.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.verified-badge{
  width:21px;
  height:21px;
  display:inline-grid;
  place-items:center;
  vertical-align:middle;
  margin-left:7px;
  border-radius:50%;
  background:#1683ff;
}
.verified-badge svg{
  width:13px;
  height:13px;
}

.profile{
  display:flex;
  align-items:center;
  gap:18px;
}
.big-avatar{
  width:90px;
  height:90px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:#14385d;
  font-size:30px;
  font-weight:900;
}
.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.queue{
  padding:18px;
  margin-bottom:12px;
  background:#0a111a;
  border:1px solid #1d2d40;
  border-radius:14px;
}
.queue-head{
  display:flex;
  align-items:center;
  gap:12px;
}
.queue-actions{
  display:flex;
  gap:9px;
  margin-top:14px;
}
.approve{
  padding:9px 14px;
  border:0;
  border-radius:9px;
  background:#188858;
  color:white;
  font-weight:700;
}
.reject{
  padding:9px 14px;
  border:1px solid #632a35;
  border-radius:9px;
  background:#2a151b;
  color:#ff9eaa;
}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
.plan{
  padding:22px;
  border-radius:17px;
  border:1px solid #203047;
  background:#0b131e;
}
.plan.featured{
  border-color:var(--blue);
}
.price{
  font-size:29px;
  font-weight:900;
  margin:12px 0;
}
.plan ul{
  color:#aab6c5;
  line-height:1.8;
  padding-left:18px;
}

.player{
  position:fixed;
  left:245px;
  right:0;
  bottom:0;
  height:88px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 22px;
  background:rgba(9,14,22,.98);
  border-top:1px solid #203047;
  z-index:60;
}
.now-cover{
  width:58px;
  height:58px;
  flex:none;
  border-radius:8px;
  overflow:hidden;
  background:#142337;
  display:grid;
  place-items:center;
  font-weight:800;
}
.now-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.now-info{
  width:210px;
  min-width:0;
}
.player-controls{
  display:flex;
  align-items:center;
  gap:8px;
}
.play-main{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:white;
  color:#07101a;
}
.progress-wrap{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
}
.progress{
  height:4px;
  flex:1;
  background:#29394d;
  border-radius:5px;
  cursor:pointer;
}
.progress-fill{
  width:0;
  height:100%;
  border-radius:5px;
  background:var(--blue);
}
.volume{width:100px}

.toast{
  display:none;
  position:fixed;
  right:22px;
  bottom:105px;
  z-index:100;
  padding:13px 17px;
  border-radius:10px;
  background:#162333;
  border:1px solid #30445c;
  box-shadow:0 10px 30px #0008;
}

.mobile-button{display:none}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
  }
  .player{left:0}
  .mobile-button{
    display:grid;
  }
  .topbar{padding:0 14px}
  .content{padding:18px}
  .hero{padding:25px}
  .hero h1{font-size:35px}
  .now-info{width:120px}
  .volume{display:none}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="logo">
    <div class="logo-mark">A</div>
    <span>Afrova</span>
  </div>

  <div class="nav">

    <div class="nav-title">DISCOVER</div>

    <button data-page="home" onclick="showPage('home')">
      <span class="nav-icon">⌂</span> Home
    </button>

    <button data-page="search" onclick="showPage('search')">
      <span class="nav-icon">⌕</span> Search
    </button>

    <button data-page="albums" onclick="showPage('albums')">
      <span class="nav-icon">▣</span> Albums
    </button>

    <div class="nav-title">YOUR LIBRARY</div>

    <button data-page="library" onclick="showPage('library')">
      <span class="nav-icon">♫</span> Library
    </button>

    <button data-page="liked" onclick="showPage('liked')">
      <span class="nav-icon">♡</span> Liked Songs
    </button>

    <button data-page="playlists" onclick="showPage('playlists')">
      <span class="nav-icon">☷</span> Playlists
    </button>

    <div class="nav-title">AFROVA</div>

    <button data-page="artist" onclick="showPage('artist')">
      <span class="nav-icon">♬</span> Artist Studio
    </button>

    <button data-page="premium" onclick="showPage('premium')">
      <span class="nav-icon">◆</span> Premium
    </button>

    <button data-page="account" onclick="showPage('account')">
      <span class="nav-icon">○</span> Account
    </button>

    <button data-page="settings" onclick="showPage('settings')">
      <span class="nav-icon">⚙</span> Settings
    </button>

    <button id="adminNav"
            data-page="admin"
            onclick="showPage('admin')"
            style="display:none">
      <span class="nav-icon">▦</span> Administration
    </button>

  </div>
</aside>

<main class="main">

<header class="topbar">

  <button class="circle mobile-button" onclick="toggleMenu()">☰</button>

  <div class="search">
    <span class="search-symbol">⌕</span>
    <input
      id="globalSearch"
      placeholder="Search songs, artists, albums..."
      onkeydown="headerSearch(event)"
    >
  </div>

  <button class="account-button" onclick="showPage('account')">
    <div class="avatar" id="headerAvatar">A</div>
    <span id="headerName">Sign in</span>
  </button>

</header>

<div id="page" class="content"></div>

</main>
</div>

<div class="player">

  <div class="now-cover" id="nowCover">A</div>

  <div class="now-info">
    <div class="song-title" id="nowTitle">Nothing playing</div>
    <div class="song-artist" id="nowArtist">Choose a song</div>
  </div>

  <div class="player-controls">
    <button class="circle" onclick="previousSong()">‹</button>
    <button class="play-main" id="playButton" onclick="togglePlay()">▶</button>
    <button class="circle" onclick="nextSong()">›</button>
  </div>

  <div class="progress-wrap">
    <span class="muted" id="currentTime">0:00</span>

    <div class="progress" onclick="seekAudio(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <span class="muted" id="duration">0:00</span>
  </div>

  <input
    class="volume"
    type="range"
    min="0"
    max="1"
    step=".01"
    value=".8"
    onchange="audio.volume=this.value"
  >

  <audio id="audio"></audio>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   AFROVA SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://eeurywspkbqbxayoyexi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ajf06QZRdqJULjf9QOT-yw_6LCjkA86";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   PAYSTACK
========================================================= */

const PAYSTACK_LINKS = {

  student:
    "https://paystack.shop/pay/k0jf1wizby",

  individual:
    "https://paystack.shop/pay/w0ov-s1tir",

  duo:
    "https://paystack.shop/pay/7a78ikzfmy",

  family:
    "https://paystack.shop/pay/47wwryj73v"

};


/* =========================================================
   STATE
========================================================= */

let session = null;
let currentUser = null;
let currentProfile = null;
let currentArtist = null;
let currentSubscription = null;

let songs = [];
let artists = [];
let albums = [];

let currentPlaylist = [];
let currentIndex = -1;

const audio = document.getElementById("audio");


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function initials(name){

  const value =
    String(name || "A").trim();

  return value
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.afrovaToast);

  window.afrovaToast =
    setTimeout(()=>{
      el.style.display="none";
    },3000);

}


function errorBox(message){

  return `
    <div class="error">
      ${esc(message)}
    </div>
  `;

}


function verifiedBadge(){

  return `
    <span class="verified-badge" title="Afrova Verified Artist">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M7 12.5l3.1 3.1L17.5 8"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  `;

}


function getPublicUrl(bucket,path){

  if(!path) return "";

  if(/^https?:\/\//i.test(path)){
    return path;
  }

  return supabaseClient
    .storage
    .from(bucket)
    .getPublicUrl(path)
    .data
    .publicUrl;

}


function getEmailRedirectUrl(){

  return window.location.href
    .split("#")[0]
    .split("?")[0];

}


function formatTime(seconds){

  if(!isFinite(seconds)){
    return "0:00";
  }

  seconds=Math.floor(seconds);

  return (
    Math.floor(seconds/60)
    + ":"
    + String(seconds%60).padStart(2,"0")
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.remove("active");
    });

  const selected =
    document.querySelector(
      `[data-page="${page}"]`
    );

  if(selected){
    selected.classList.add("active");
  }

  document
    .getElementById("sidebar")
    .classList.remove("open");

  if(page==="home") renderHome();
  else if(page==="search") renderSearch();
  else if(page==="albums") renderAlbums();
  else if(page==="library") renderLibrary();
  else if(page==="liked") renderLiked();
  else if(page==="playlists") renderPlaylists();
  else if(page==="artist") renderArtistStudio();
  else if(page==="premium") renderPremium();
  else if(page==="account") renderAccount();
  else if(page==="settings") renderSettings();
  else if(page==="admin") renderAdmin();

}


function toggleMenu(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


/* =========================================================
   USER
========================================================= */

async function loadCurrentUser(){

  const result =
    await supabaseClient.auth.getSession();

  session=result.data.session;
  currentUser=session?.user || null;

  if(!currentUser){

    currentProfile=null;
    currentArtist=null;
    currentSubscription=null;

    updateHeader();
    updateAdminVisibility();

    return;

  }


  let profile =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  currentProfile=profile.data;


  if(!currentProfile){

    await supabaseClient
      .from("profiles")
      .insert({
        id:currentUser.id,
        display_name:
          currentUser.user_metadata?.display_name
          ||
          currentUser.email?.split("@")[0]
          ||
          "Afrova User",
        role:"listener"
      });

    const second =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    currentProfile=second.data;

  }


  const artist =
    await supabaseClient
      .from("artist_profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  currentArtist=artist.data;


  const subscription =
    await supabaseClient
      .from("subscriptions")
      .select("*")
      .eq("user_id",currentUser.id)
      .maybeSingle();

  currentSubscription=subscription.data;


  updateHeader();
  updateAdminVisibility();

}


function updateHeader(){

  const name =
    document.getElementById("headerName");

  const avatar =

/* =========================================================
   SIGN UP
========================================================= */

async function signUp(){

  const name =
    document.getElementById("signupName")
      .value.trim();

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;


  if(!name || !email || !password){

    document.getElementById("authMessage")
      .innerHTML =
      errorBox("Please complete all fields.");

    return;

  }


  if(password.length<6){

    document.getElementById("authMessage")
      .innerHTML =
      errorBox(
        "Password must be at least 6 characters."
      );

    return;

  }


  const result =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          display_name:name
        },

        emailRedirectTo:
          getEmailRedirectUrl()
      }

    });


  if(result.error){

    document.getElementById("authMessage")
      .innerHTML =
      errorBox(result.error.message);

    return;

  }


  document.getElementById("authMessage")
    .innerHTML = `
      <div class="notice">
        Account created successfully.
        Check your email and click the
        confirmation link to verify your Afrova account.
      </div>
    `;

}


/* =========================================================
   SIGN IN
========================================================= */

async function signIn(){

  const email =
    document.getElementById("loginEmail")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;


  const result =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  if(result.error){

    document.getElementById("authMessage")
      .innerHTML =
      errorBox(result.error.message);

    return;

  }


  await loadCurrentUser();

  toast("Welcome back to Afrova.");

  showPage("home");

}


/* =========================================================
   RESEND EMAIL
========================================================= */

async function resendConfirmation(){

  const input =
    document.getElementById("loginEmail");

  if(!input){

    toast("Open Sign In first.");
    return;

  }

  const email=input.value.trim();

  if(!email){

    toast("Enter your email first.");
    return;

  }


  const result =
    await supabaseClient.auth.resend({

      type:"signup",

      email,

      options:{
        emailRedirectTo:
          getEmailRedirectUrl()
      }

    });


  if(result.error){
    toast(result.error.message);
  }else{
    toast("Confirmation email sent.");
  }

}

/* =========================================================
   SEARCH
========================================================= */

function headerSearch(event){

  if(event.key!=="Enter") return;

  const value =
    event.target.value.trim();

  if(!value) return;

  showPage("search");

  setTimeout(()=>{
    const input=
      document.getElementById("searchInput");

    if(input) input.value=value;

    runSearch(value);
  },50);

}


async function renderSearch(){

  document.getElementById("page").innerHTML=`

    <h1 class="page-title">Search</h1>

    <p class="page-sub">
      Find songs, artists and albums.
    </p>

    <div class="panel">

      <div class="search" style="width:100%">

        <span class="search-symbol">⌕</span>

        <input
          id="searchInput"
          placeholder="Search Afrova..."
          onkeydown="
            if(event.key==='Enter')
            runSearch(this.value)
          "
        >

      </div>

    </div>

    <div id="searchResults"></div>

  `;

}


async function runSearch(query){

  query=String(query||"").trim();

  if(!query) return;


  const results =
    document.getElementById("searchResults");

  if(!results) return;

  results.innerHTML=
    `<div class="muted">Searching...</div>`;


  const songResult =
    await supabaseClient
      .from("songs")
      .select("*")
      .eq("status","published")
      .ilike("title",`%${query}%`)
      .limit(30);


  const artistResult =
    await supabaseClient
      .from("artist_profiles")
      .select("*")
      .eq("verification_status","approved")
      .ilike(
        "artist_name",
        `%${query}%`
      )
      .limit(20);


  const albumResult =
    await supabaseClient
      .from("albums")
      .select("*")
      .eq("status","published")
      .ilike("title",`%${query}%`)
      .limit(20);


  const foundSongs =
    songResult.data || [];

  const foundArtists =
    artistResult.data || [];

  const foundAlbums =
    albumResult.data || [];


  results.innerHTML=`

    <section class="section">

      <h2>Songs</h2>

      <div class="panel">

        ${
          foundSongs.length
          ?
          foundSongs
            .map((s,i)=>
              songRow(s,i,foundSongs)
            )
            .join("")
          :
          `<div class="empty">
            No matching songs.
          </div>`
        }

      </div>

    </section>


    <section class="section">

      <h2>Artists</h2>

      <div
        class="grid"
        style="margin-top:15px"
      >

        ${
          foundArtists.length
          ?
          foundArtists
            .map(artistCard)
            .join("")
          :
          `<div class="empty">
            No matching artists.
          </div>`
        }

      </div>

    </section>


    <section class="section">

      <h2>Albums</h2>

      <div
        class="grid"
        style="margin-top:15px"
      >

        ${
          foundAlbums.length
          ?
          foundAlbums
            .map(albumCard)
            .join("")
          :
          `<div class="empty">
            No matching albums.
          </div>`
        }

      </div>

    </section>

  `;

}

async function uploadMusic(){

  if(
    !currentUser ||
    currentProfile?.role!=="artist"
  ){

    toast("Artist access required.");
    return;

  }


  const title =
    document.getElementById("musicTitle")
      .value.trim();

  const genre =
    document.getElementById("musicGenre")
      .value.trim();

  const releaseType =
    document.getElementById("musicReleaseType")
      .value;

  const audioFile =
    document.getElementById("musicFile")
      .files[0];

  const coverFile =
    document.getElementById("musicCover")
      .files[0];


  if(!title || !audioFile){

    toast(
      "Song title and audio file are required."
    );

    return;

  }


  toast("Uploading music...");


  const safeName =
    audioFile.name
      .replace(/\s+/g,"-")
      .replace(/[^a-zA-Z0-9._-]/g,"");


  const audioPath =
    currentUser.id
    + "/"
    + Date.now()
    + "-"
    + safeName;


  const audioUpload =
    await supabaseClient.storage
      .from("music")
      .upload(
        audioPath,
        audioFile,
        {upsert:false}
      );


  if(audioUpload.error){

    toast(audioUpload.error.message);
    return;

  }


  let coverPath=null;


  if(coverFile){

    const safeCover =
      coverFile.name
        .replace(/\s+/g,"-")
        .replace(/[^a-zA-Z0-9._-]/g,"");


    coverPath =
      currentUser.id
      + "/"
      + Date.now()
      + "-"
      + safeCover;


    const coverUpload =
      await supabaseClient.storage
        .from("covers")
        .upload(
          coverPath,
          coverFile,
          {upsert:false}
        );


    if(coverUpload.error){

      toast(coverUpload.error.message);
      return;

    }

  }


  const songResult =
    await supabaseClient
      .from("songs")
      .insert({

        artist_id:currentUser.id,

        title,

        audio_path:audioPath,

        cover_path:coverPath,

        genre,

        status:"pending"

      });


  if(songResult.error){

    toast(songResult.error.message);
    return;

  }


  toast(
    "Music submitted for Afrova review."
  );

  showPage("artist");

}

  status
){

    note =
      prompt(
        "Reason for rejection (optional):"
      ) || null;

  const result =
    await supabaseClient.rpc(
      "admin_review_artist",

        requested_status:status,
        requested_note:note

  toast(
    status==="approved"

      "Artist application rejected."

  await loadCurrentUser();

  renderAdmin();

  currentIndex=index;

  const song =
    currentPlaylist[currentIndex];

  if(!song) return;


  const audioUrl =
    getPublicUrl(
      "music",
      song.audio_path
    );


  if(!audioUrl){

    toast(
      "This song has no audio file."
    );

    return;

  }


  audio.src=audioUrl;

  audio.play().catch(()=>{});


  document.getElementById(
    "nowTitle"
  ).textContent =
    song.title || "Unknown";


  document.getElementById(
    "nowArtist"
  ).textContent =
    "Afrova Artist";


  const cover =
    getPublicUrl(
      "covers",
      song.cover_path
    );


  document.getElementById(
    "nowCover"
  ).innerHTML =
    cover
      ?
      `<img src="${esc(cover)}">`
      :
      esc((song.title||"A")[0]);


  document.getElementById(
    "playButton"
  ).textContent="Ⅱ";


  recordStream(song);

}


async function recordStream(song){

  if(
    !currentUser ||
    currentProfile?.role==="admin" ||
    !song?.id
  ){
    return;
  }


  await supabaseClient
    .from("song_streams")
    .insert({

      song_id:song.id,

      listener_id:currentUser.id

    });

}


function togglePlay(){

  if(!audio.src){

    toast(
      "Choose a song first."
    );

    return;

  }


  if(audio.paused){

    audio.play();

    document.getElementById(
      "playButton"
    ).textContent="Ⅱ";

  }else{

    audio.pause();

    document.getElementById(
      "playButton"
    ).textContent="▶";

  }

}


function nextSong(){

  if(!currentPlaylist.length) return;

  currentIndex =
    (currentIndex+1)
    %
    currentPlaylist.length;

  playSongByIndex(
    currentIndex,
    currentPlaylist
  );

}


function previousSong(){

  if(!currentPlaylist.length) return;

  currentIndex =
    (
      currentIndex-1
      +
      currentPlaylist.length
    )
    %
    currentPlaylist.length;

  playSongByIndex(
    currentIndex,
    currentPlaylist
  );

}


function seekAudio(event){

  if(!audio.duration) return;

  const rect =
    event.currentTarget
      .getBoundingClientRect();

  const percentage =
    (event.clientX-rect.left)
    /
    rect.width;

  audio.currentTime =
    percentage * audio.duration;

}


audio.addEventListener(
  "timeupdate",
  ()=>{

    document.getElementById(
      "currentTime"
    ).textContent =
      formatTime(audio.currentTime);


    document.getElementById(
      "duration"
    ).textContent =
      formatTime(audio.duration);


    document.getElementById(
      "progressFill"
    ).style.width =
      audio.duration
        ?
        (
          audio.currentTime
          /
          audio.duration
          *
          100
        )+"%"
        :
        "0%";

  }
);


audio.addEventListener(
  "ended",
  nextSong
);


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async(event,newSession)=>{

    session=newSession;

    currentUser =
      newSession?.user || null;

    setTimeout(
      async()=>{
        await loadCurrentUser();
      },
      0
    );

  }
);


/* =========================================================
   START
========================================================= */

(async function(){

  await loadCurrentUser();

  showPage("home");

})();
