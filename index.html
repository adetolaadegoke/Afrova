<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afrova — Music for Everyone</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --blue:#1683ff;
      --blue-dark:#0867d8;
      --blue-light:#eaf4ff;
      --bg:#f7f9fc;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --danger:#dc2626;
      --success:#16a34a;
      --sidebar:#ffffff;
      --player:#ffffff;
      --shadow:0 8px 30px rgba(15,23,42,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .app{
      display:flex;
      min-height:100vh;
      padding-bottom:92px;
    }

    /* SIDEBAR */

    .sidebar{
      width:250px;
      background:var(--sidebar);
      border-right:1px solid var(--line);
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      padding:24px 16px;
      overflow-y:auto;
      z-index:50;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:25px;
      font-weight:800;
      margin-bottom:32px;
      padding:0 10px;
    }

    .logo-mark{
      width:34px;
      height:34px;
      border-radius:11px;
      background:var(--blue);
      display:grid;
      place-items:center;
      color:white;
      font-weight:900;
    }

    .nav-title{
      color:#9ca3af;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.08em;
      padding:0 12px;
      margin:18px 0 8px;
    }

    .nav-btn{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border:0;
      background:transparent;
      color:#4b5563;
      border-radius:12px;
      margin-bottom:3px;
      text-align:left;
      font-weight:600;
    }

    .nav-btn:hover{
      background:#f3f6fa;
      color:var(--blue);
    }

    .nav-btn.active{
      background:var(--blue-light);
      color:var(--blue);
    }

    .nav-icon{
      width:20px;
      height:20px;
      flex:none;
    }

    .admin-nav{
      display:none;
    }

    /* MAIN */

    .main{
      margin-left:250px;
      width:calc(100% - 250px);
      min-width:0;
    }

    .topbar{
      height:76px;
      display:flex;
      align-items:center;
      gap:15px;
      padding:0 30px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.95);
      position:sticky;
      top:0;
      z-index:40;
    }

    .search-box{
      flex:1;
      max-width:600px;
      position:relative;
    }

    .search-box input{
      width:100%;
      height:44px;
      border:1px solid var(--line);
      border-radius:24px;
      padding:0 18px 0 44px;
      outline:none;
      background:#f5f7fa;
    }

    .search-box input:focus{
      border-color:var(--blue);
      background:#fff;
    }

    .search-symbol{
      position:absolute;
      left:16px;
      top:13px;
      color:#8a94a3;
    }

    .top-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .account-button{
      display:flex;
      align-items:center;
      gap:9px;
      border:1px solid var(--line);
      background:white;
      padding:7px 12px 7px 7px;
      border-radius:24px;
      font-weight:700;
    }

    .avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      background:var(--blue);
      color:white;
      display:grid;
      place-items:center;
      font-size:13px;
      font-weight:800;
      overflow:hidden;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .guest-login{
      border:0;
      background:var(--blue);
      color:white;
      padding:11px 18px;
      border-radius:22px;
      font-weight:700;
    }

    .content{
      padding:30px;
      max-width:1500px;
      margin:auto;
    }

    /* HERO */

    .hero{
      background:linear-gradient(135deg,#0b73e8,#41a1ff);
      color:white;
      border-radius:24px;
      padding:38px;
      min-height:270px;
      display:flex;
      align-items:flex-end;
      position:relative;
      overflow:hidden;
      margin-bottom:34px;
    }

    .hero:after{
      content:"";
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      border:70px solid rgba(255,255,255,.08);
      right:-150px;
      top:-180px;
    }

    .hero-content{
      position:relative;
      z-index:2;
    }

    .hero small{
      font-weight:700;
      opacity:.85;
    }

    .hero h1{
      font-size:42px;
      line-height:1.05;
      margin:10px 0;
    }

    .hero p{
      max-width:560px;
      line-height:1.6;
      opacity:.92;
    }

    /* SECTIONS */

    .section{
      margin-bottom:36px;
    }

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:17px;
    }

    .section-header h2{
      font-size:22px;
    }

    .see-all{
      border:0;
      background:transparent;
      color:var(--blue);
      font-weight:700;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
    }

    .music-card{
      background:white;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      transition:.2s;
    }

    .music-card:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow);
    }

    .cover{
      width:100%;
      aspect-ratio:1;
      border-radius:12px;
      object-fit:cover;
      background:linear-gradient(135deg,#dbeafe,#93c5fd);
      display:block;
    }

    .card-title{
      font-weight:800;
      margin-top:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .card-artist{
      color:var(--muted);
      font-size:13px;
      margin-top:5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .artist-link{
      color:var(--muted);
      cursor:pointer;
    }

    .artist-link:hover{
      color:var(--blue);
    }

    .play-card{
      border:0;
      background:var(--blue);
      color:white;
      width:38px;
      height:38px;
      border-radius:50%;
      margin-top:10px;
      float:right;
      display:grid;
      place-items:center;
    }

    /* VERIFIED BADGE */

    .verified-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:19px;
      height:19px;
      background:#1683ff;
      border-radius:50%;
      vertical-align:middle;
      margin-left:5px;
      flex:none;
    }

    .verified-badge svg{
      width:12px;
      height:12px;
      fill:none;
      stroke:#fff;
      stroke-width:3;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .artist-name-row{
      display:flex;
      align-items:center;
      gap:2px;
    }

    /* BUTTONS */

    .btn{
      border:0;
      border-radius:11px;
      padding:11px 16px;
      font-weight:700;
    }

    .btn-primary{
      background:var(--blue);
      color:white;
    }

    .btn-primary:hover{
      background:var(--blue-dark);
    }

    .btn-secondary{
      background:#eef2f7;
      color:#374151;
    }

    .btn-danger{
      background:#fee2e2;
      color:#b91c1c;
    }

    .btn-success{
      background:#dcfce7;
      color:#15803d;
    }

    .btn-small{
      padding:8px 11px;
      font-size:12px;
    }

    /* PAGE */

    .page-title{
      margin-bottom:25px;
    }

    .page-title h1{
      font-size:30px;
      margin-bottom:7px;
    }

    .page-title p{
      color:var(--muted);
    }

    .empty{
      background:white;
      border:1px dashed #cfd6df;
      border-radius:16px;
      padding:40px;
      text-align:center;
      color:var(--muted);
    }

    /* ACCOUNT */

    .account-header{
      background:white;
      border:1px solid var(--line);
      border-radius:22px;
      padding:28px;
      display:flex;
      align-items:center;
      gap:22px;
      margin-bottom:22px;
    }

    .large-avatar{
      width:100px;
      height:100px;
      border-radius:50%;
      background:var(--blue);
      color:white;
      display:grid;
      place-items:center;
      font-size:32px;
      font-weight:800;
      overflow:hidden;
      flex:none;
    }

    .large-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .account-info h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .account-info p{
      color:var(--muted);
      margin-bottom:5px;
    }

    .role-pill{
      display:inline-block;
      background:var(--blue-light);
      color:var(--blue);
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:800;
      margin-top:7px;
    }

    .account-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .account-card{
      background:white;
      border:1px solid var(--line);
      border-radius:17px;
      padding:20px;
    }

    .account-card h3{
      margin-bottom:8px;
    }

    .account-card p{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    /* FORMS */

    .form-card{
      background:white;
      border:1px solid var(--line);
      border-radius:18px;
      padding:25px;
      max-width:750px;
    }

    .field{
      margin-bottom:17px;
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
    }

    .field input,
    .field textarea,
    .field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:11px;
      padding:12px;
      outline:none;
      background:white;
    }

    .field textarea{
      min-height:110px;
      resize:vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus{
      border-color:var(--blue);
    }

    /* ARTIST */

    .artist-profile{
      background:linear-gradient(135deg,#081b33,#0c447e);
      color:white;
      border-radius:22px;
      padding:32px;
      display:flex;
      align-items:center;
      gap:24px;
      margin-bottom:22px;
    }

    .artist-photo{
      width:130px;
      height:130px;
      border-radius:50%;
      object-fit:cover;
      background:#dbeafe;
      flex:none;
    }

    .artist-profile h1{
      font-size:34px;
      margin-bottom:9px;
    }

    .artist-bio{
      color:#dbeafe;
      line-height:1.5;
      max-width:650px;
      margin-bottom:15px;
    }

    .stats{
      display:flex;
      gap:28px;
      flex-wrap:wrap;
    }

    .stat strong{
      display:block;
      font-size:20px;
    }

    .stat span{
      color:#bfdbfe;
      font-size:12px;
    }

    .artist-actions{
      margin-left:auto;
    }

    .artist-actions button{
      background:white;
      color:#0c447e;
    }

    /* ADMIN */

    .admin-banner{
      background:#101827;
      color:white;
      border-radius:20px;
      padding:25px;
      margin-bottom:22px;
    }

    .admin-banner h2{
      margin-bottom:6px;
    }

    .admin-banner p{
      color:#cbd5e1;
    }

    .admin-stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:14px;
      margin:20px 0;
    }

    .admin-stat{
      background:white;
      border:1px solid var(--line);
      border-radius:15px;
      padding:20px;
    }

    .admin-stat strong{
      font-size:27px;
      display:block;
      margin-bottom:5px;
    }

    .admin-stat span{
      color:var(--muted);
      font-size:13px;
    }

    .admin-tabs{
      display:flex;
      gap:8px;
      overflow-x:auto;
      margin-bottom:17px;
    }

    .admin-tab{
      border:1px solid var(--line);
      background:white;
      padding:10px 14px;
      border-radius:10px;
      white-space:nowrap;
      font-weight:700;
    }

    .admin-tab.active{
      background:var(--blue);
      color:white;
      border-color:var(--blue);
    }

    .admin-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .admin-item{
      background:white;
      border:1px solid var(--line);
      border-radius:15px;
      padding:17px;
      display:flex;
      align-items:center;
      gap:15px;
    }

    .admin-item-main{
      flex:1;
      min-width:0;
    }

    .admin-item-main strong{
      display:block;
      margin-bottom:4px;
    }

    .admin-item-main small{
      color:var(--muted);
      display:block;
      margin-top:3px;
    }

    .admin-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    /* PREMIUM */

    .plans{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .plan{
      background:white;
      border:1px solid var(--line);
      border-radius:19px;
      padding:25px;
    }

    .plan h3{
      margin-bottom:9px;
    }

    .price{
      font-size:30px;
      font-weight:800;
      margin-bottom:6px;
    }

    .price span{
      font-size:13px;
      color:var(--muted);
      font-weight:400;
    }

    .plan p{
      color:var(--muted);
      min-height:50px;
      line-height:1.5;
      font-size:14px;
      margin-bottom:18px;
    }

    .premium-active{
      background:#eaf4ff;
      border:1px solid #b9dcff;
      padding:20px;
      border-radius:16px;
      margin-bottom:20px;
      color:#075bbd;
      font-weight:700;
    }

    /* ALBUM */

    .album-header{
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:25px;
      display:flex;
      gap:22px;
      align-items:center;
      margin-bottom:22px;
    }

    .album-cover{
      width:180px;
      height:180px;
      object-fit:cover;
      border-radius:15px;
      background:#dbeafe;
    }

    .track-list{
      background:white;
      border:1px solid var(--line);
      border-radius:17px;
      overflow:hidden;
    }

    .track{
      display:flex;
      align-items:center;
      gap:15px;
      padding:14px 18px;
      border-bottom:1px solid var(--line);
    }

    .track:last-child{
      border-bottom:0;
    }

    .track-number{
      width:25px;
      color:var(--muted);
    }

    .track-main{
      flex:1;
      min-width:0;
    }

    .track-main strong{
      display:block;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .track-main small{
      color:var(--muted);
    }

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:100%;
      max-width:600px;
      max-height:90vh;
      overflow-y:auto;
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .close{
      width:34px;
      height:34px;
      border:0;
      border-radius:50%;
      background:#eef2f7;
      font-size:20px;
    }

    /* PLAYER */

    .player{
      position:fixed;
      left:250px;
      right:0;
      bottom:0;
      height:88px;
      background:var(--player);
      border-top:1px solid var(--line);
      display:flex;
      align-items:center;
      gap:18px;
      padding:10px 25px;
      z-index:60;
    }

    .player-cover{
      width:60px;
      height:60px;
      border-radius:9px;
      object-fit:cover;
      background:#dbeafe;
    }

    .player-info{
      width:220px;
      min-width:120px;
    }

    .player-info strong{
      display:block;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player-info span{
      color:var(--muted);
      font-size:12px;
    }

    .player-controls{
      display:flex;
      align-items:center;
      gap:14px;
      margin:auto;
    }

    .player-controls button{
      border:0;
      background:transparent;
      width:35px;
      height:35px;
      border-radius:50%;
    }

    .player-controls .main-play{
      background:var(--blue);
      color:white;
    }

    .volume{
      width:130px;
    }

    .volume input{
      width:100%;
    }

    /* TOAST */

    .toast{
      position:fixed;
      right:22px;
      bottom:110px;
      background:#111827;
      color:white;
      padding:13px 17px;
      border-radius:11px;
      z-index:200;
      display:none;
      max-width:360px;
      box-shadow:var(--shadow);
    }

    .toast.show{
      display:block;
    }

    /* AUTH */

    .auth-wrap{
      min-height:70vh;
      display:grid;
      place-items:center;
    }

    .auth-card{
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      padding:30px;
      width:100%;
      max-width:460px;
      box-shadow:var(--shadow);
    }

    .auth-card h1{
      margin-bottom:7px;
    }

    .auth-card > p{
      color:var(--muted);
      margin-bottom:22px;
    }

    .auth-switch{
      margin-top:17px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .auth-switch button{
      border:0;
      background:transparent;
      color:var(--blue);
      font-weight:700;
    }

    /* RESPONSIVE */

    @media(max-width:850px){
      .sidebar{
        width:74px;
        padding:20px 8px;
      }

      .logo{
        justify-content:center;
        padding:0;
      }

      .logo span{
        display:none;
      }

      .nav-title{
        display:none;
      }

      .nav-btn{
        justify-content:center;
      }

      .nav-btn span{
        display:none;
      }

      .main{
        margin-left:74px;
        width:calc(100% - 74px);
      }

      .player{
        left:74px;
      }

      .content{
        padding:20px;
      }

      .hero{
        padding:27px;
      }

      .hero h1{
        font-size:32px;
      }

      .artist-profile{
        align-items:flex-start;
        flex-direction:column;
      }

      .artist-actions{
        margin-left:0;
      }

      .album-header{
        align-items:flex-start;
        flex-direction:column;
      }

      .player-info{
        width:130px;
      }

      .volume{
        display:none;
      }
    }

    @media(max-width:550px){
      .topbar{
        padding:0 12px;
      }

      .guest-login{
        padding:9px 13px;
      }

      .account-button span{
        display:none;
      }

      .cards{
        grid-template-columns:repeat(2,1fr);
      }

      .player{
        height:75px;
        padding:7px 10px;
        gap:9px;
      }

      .player-cover{
        width:50px;
        height:50px;
      }

      .player-info{
        width:105px;
      }

      .player-controls{
        gap:4px;
      }

      .player-controls button{
        width:30px;
        height:30px;
      }

      .account-header{
        align-items:flex-start;
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-mark">A</div>
      <span>Afrova</span>
    </div>

    <div class="nav-title">Discover</div>

    <button class="nav-btn active" data-page="home" onclick="showPage('home')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5 10v10h14V10"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-page="search" onclick="showPage('search')">

<script>
/* =========================================================

========================================================= */

const SUPABASE_URL =

const SUPABASE_KEY =
  "sb_publishable_Ajf06QZRdqJULjf9QOT-yw_6LCjkA86";

const { createClient } = window.supabase;

const supabase = createClient(

/* PAYSTACK LINKS */

/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const value = String(name || "A").trim();

  if(!value) return "A";

  return value
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function showToast(message){
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 3200);
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

function openModal(id){
  document.getElementById(id).classList.add("show");
}

function coverUrl(path){

  if(!path){
    return "";
  }

  if(path.startsWith("http")){
    return path;
  }

  return `${SUPABASE_URL}/storage/v1/object/public/covers/${path}`;
}

function audioUrl(path){

  if(!path){
    return "";
  }

  if(path.startsWith("http")){
    return path;
  }

  return `${SUPABASE_URL}/storage/v1/object/public/music/${path}`;
}

function verifiedBadge(){
  return `
    <span
      class="verified-badge"
      title="Verified artist"
      aria-label="Verified artist"
    >
      <svg viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6"></path>
      </svg>
    </span>
  `;
}


/* =========================================================
   AUTH
========================================================= */

async function init(){

  const result = await supabase.auth.getSession();

  session = result.data.session;
  user = session?.user || null;

  await loadUserData();

  renderTopActions();
  showPage("home");

  supabase.auth.onAuthStateChange(async (_event,newSession) => {

    session = newSession;
    user = newSession?.user || null;

    await loadUserData();

    renderTopActions();

    if(currentPage === "account"){
      renderAccount();
    }

    if(currentPage === "admin"){
      renderAdmin();
    }
  });
}


async function loadUserData(){

  profile = null;
  artistProfile = null;
  subscription = null;

  if(!user){
    document.getElementById("adminNav").style.display = "none";
    return;
  }

  let profileResult = await supabase
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  profile = profileResult.data;

  if(!profile){

    const displayName =
      user.user_metadata?.display_name ||
      user.email?.split("@")[0] ||
      "Afrova User";

    const insertResult = await supabase
      .from("profiles")
      .insert({
        id:user.id,
        display_name:displayName
      })
      .select()
      .single();

    profile = insertResult.data;
  }

  const artistResult = await supabase
    .from("artist_profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  artistProfile = artistResult.data;

  const subResult = await supabase
    .from("subscriptions")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();

  subscription = subResult.data;

  if(profile?.role === "admin"){
    document.getElementById("adminNav").style.display = "flex";
  }else{
    document.getElementById("adminNav").style.display = "none";
  }
}


/* =========================================================
   TOP ACCOUNT BUTTON
========================================================= */

function renderTopActions(){

  const el = document.getElementById("topActions");

  if(!user){

    el.innerHTML = `
      <button class="guest-login" onclick="openAuth('login')">
        Log in
      </button>
    `;

    return;
  }

  const name =
    profile?.display_name ||
    user.email?.split("@")[0] ||
    "Account";

  el.innerHTML = `
    <button class="account-button" onclick="showPage('account')">

      <div class="avatar">
        ${profile?.avatar_url
          ? `<img src="${escapeHtml(profile.avatar_url)}">`
          : escapeHtml(initials(name))
        }
      </div>

      <span>${escapeHtml(name)}</span>

    </button>
  `;
}


/* =========================================================
   AUTH UI
========================================================= */

function openAuth(mode="login"){

  authMode = mode;

  document.getElementById("authName").value = "";
  document.getElementById("authEmail").value = "";
  document.getElementById("authPassword").value = "";

  updateAuthModal();

  openModal("authModal");
}

function toggleAuthMode(){

  authMode =
    authMode === "login"
      ? "signup"
      : "login";

  updateAuthModal();
}

function updateAuthModal(){

  const signup = authMode === "signup";

  document.getElementById("authTitle").textContent =
    signup
      ? "Create your Afrova account"
      : "Sign in to Afrova";

  document.getElementById("nameField").style.display =
    signup ? "block" : "none";

  document.getElementById("authSubmit").textContent =
    signup ? "Create account" : "Sign in";

  document.getElementById("authSwitchText").textContent =
    signup
      ? "Already have an account?"
      : "Don't have an account?";

  document.getElementById("authSwitchButton").textContent =
    signup
      ? "Log in"
      : "Create account";
}


function getRedirectUrl(){

  return window.location.href
    .split("#")[0]
    .split("?")[0];
}


async function submitAuth(){

  const email =
    document.getElementById("authEmail").value.trim();

  const password =
    document.getElementById("authPassword").value;

  const name =
    document.getElementById("authName").value.trim();

  if(!email || !password){

    showToast("Enter your email and password.");

    return;
  }

  if(authMode === "signup"){

    if(!name){

      showToast("Enter your display name.");

      return;
    }

    const result =
      await supabase.auth.signUp({

        email,
        password,

        options:{
          data:{
            display_name:name
          },

          emailRedirectTo:getRedirectUrl()
        }
      });

    if(result.error){

      showToast(result.error.message);

      return;
    }

    closeModal("authModal");

    showToast(
      "Account created. Check your email to confirm your account."
    );

    return;
  }


  const result =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if(result.error){

    showToast(result.error.message);

    return;
  }

  closeModal("authModal");

  showToast("Welcome back to Afrova.");

  await loadUserData();

  renderTopActions();

  showPage("account");
}


async function logout(){

  await supabase.auth.signOut();

  session = null;
  user = null;
  profile = null;
  artistProfile = null;
  subscription = null;

  renderTopActions();

  showPage("home");

  showToast("You have been logged out. You can log in again anytime.");
}


/* =========================================================
   PAGE SYSTEM
========================================================= */

function showPage(page){

  if(page === "admin" && profile?.role !== "admin"){

    showToast("Admin access is required.");

    return;
  }

  currentPage = page;

  document.querySelectorAll(".nav-btn").forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.page === page
    );
  });

  switch(page){

    case "home":
      renderHome();
      break;

    case "search":
      renderSearchPage("");
      break;

    case "albums":
      renderAlbums();
      break;

    case "liked":
      renderLiked();
      break;

    case "playlists":
      renderPlaylists();
      break;

    case "artist":
      renderArtistStudio();
      break;

    case "premium":
      renderPremium();
      break;

    case "account":
      renderAccount();
      break;

    case "settings":
      renderSettings();
      break;

    case "admin":
      renderAdmin();
      break;

    default:
      renderHome();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

async function loadHomeSongs(){

  const result =
    await supabase
      .from("songs")
      .select(`
        id,
        title,
        audio_path,
        cover_path,
        genre,
        artist_id,
        album_id,
        track_number,
        artist_profiles (
          id,
          artist_name,
          verification_status
        )
      `)
      .eq("status","published")
      .order("created_at",{ascending:false})
      .limit(12);

  const list = result.data || [];

  songs = list;

  const el = document.getElementById("homeSongs");

  if(!el) return;

  if(!list.length){

    el.innerHTML =
      `<div class="empty">No published music yet.</div>`;

    return;

  el.innerHTML =
    list.map(songCard).join("");
}

async function renderSearchPage(term=""){

  const container =
    document.getElementById("pageContent");

  container.innerHTML = `
    <div class="page-title">
      <h1>Search</h1>
      <p>Find music and artists on Afrova.</p>
    </div>

    <div id="searchResults">
      ${
        term
          ? `<div class="empty">Searching...</div>`
          : `<div class="empty">Start typing in the search box above.</div>`
      }
    </div>
  `;

  if(!term) return;

  const songResult =
    await supabase
      .from("songs")
      .select(`
        *,
        artist_profiles (
          artist_name,
          verification_status
        )
      `)
      .eq("status","published")
      .ilike("title",`%${term}%`)
      .limit(30);

  const artistResult =
    await supabase
      .from("artist_profiles")

async function toggleFollow(artistId,isFollowing){

  if(!user){

    openAuth("login");

    return;
  }

  if(isFollowing){

    await supabase
      .from("artist_follows")
      .delete()
      .eq("artist_id",artistId)
      .eq("user_id",user.id);

  }else{

    await supabase
      .from("artist_follows")
      .insert({
        artist_id:artistId,
        user_id:user.id
      });
  }

  openPublicArtist(artistId);
}

========================================================= */

async function playSongById(songId){

  const index =
    songs.findIndex(x => x.id === songId);

  if(index >= 0){

    currentSongIndex = index;

    playCurrentSong();

    return;
  }

  const result =
    await supabase
      .from("songs")
      .select(`
        *,
        artist_profiles (
          artist_name,
          verification_status
        )
      `)
      .eq("id",songId)
      .eq("status","published")
      .single();

  if(result.error){

    showToast("Song could not be played.");

    return;
  }

  songs.push(result.data);

  currentSongIndex = songs.length - 1;

  playCurrentSong();
}


function playSongObject(song){

  songs = [song];

  currentSongIndex = 0;

  playCurrentSong();
}


async function playCurrentSong(){

  const song =
    songs[currentSongIndex];

  if(!song) return;

  const path =
    song.audio_path;

  if(!path){

    showToast("This song has no audio file.");

    return;
  }

  const artist =
    song.artist_profiles?.artist_name ||
    "Unknown artist";

  document.getElementById("playerTitle").textContent =
    song.title || "Untitled";

  document.getElementById("playerArtist").textContent =
    artist;

  document.getElementById("playerCover").src =
    coverUrl(song.cover_path) ||
    "https://placehold.co/500x500/eaf4ff/1683ff?text=Afrova";

  audio.src =
    audioUrl(path);

  try{

    await audio.play();

    document.getElementById("playButton").textContent =
      "Ⅱ";

    recordStream(song.id);

  }catch(error){

    showToast("The audio could not be played.");

  }
}


async function recordStream(songId){

  if(!user) return;

  await supabase
    .from("song_streams")
    .insert({
      song_id:songId,
      listener_id:user.id
    });
}


function togglePlay(){

  if(!audio.src){

    showToast("Choose a song first.");

    return;
  }

  if(audio.paused){

    audio.play();

    document.getElementById("playButton").textContent =
      "Ⅱ";

  }else{

    audio.pause();

    document.getElementById("playButton").textContent =
      "▶";
  }
}


function nextSong(){

  if(!songs.length) return;

  currentSongIndex =
    (currentSongIndex + 1) % songs.length;

  playCurrentSong();
}


function previousSong(){

  if(!songs.length) return;

  currentSongIndex =
    currentSongIndex <= 0
      ? songs.length - 1
      : currentSongIndex - 1;

  playCurrentSong();
}


function changeVolume(value){

  audio.volume = Number(value);
}


audio.addEventListener("ended",nextSong);

audio.addEventListener("play",() => {
  document.getElementById("playButton").textContent = "Ⅱ";
});

audio.addEventListener("pause",() => {
  document.getElementById("playButton").textContent = "▶";
});

async function createRelease(){

  if(!artistProfile){

    showToast("Artist profile required.");

    return;
  }

  if(artistProfile.verification_status !== "approved"){

    showToast("Artist approval is required.");

    return;
  }

  const type =
    document.getElementById("releaseType").value;

  const title =
    document.getElementById("releaseTitle").value.trim();

  const coverFile =
    document.getElementById("releaseCover").files[0];

  const audioFiles =
    Array.from(
      document.getElementById("releaseAudio").files
    );

  const releaseDate =
    document.getElementById("releaseDate").value || null;

  if(!title){

    showToast("Enter a release title.");

    return;
  }

  if(!audioFiles.length){

    showToast("Select at least one audio file.");

    return;
  }

  let coverPath = null;

  if(coverFile){

    const extension =
      coverFile.name.split(".").pop();

    coverPath =
      `${user.id}/${crypto.randomUUID()}.${extension}`;

    const upload =
      await supabase.storage
        .from("covers")
        .upload(coverPath,coverFile,{
          upsert:false
        });

    if(upload.error){

      showToast(upload.error.message);

      return;
    }
  }

  const albumResult =
    await supabase
      .from("albums")
      .insert({
        artist_id:user.id,
        title,
        release_type:type,
        cover_path:coverPath,
        release_date:releaseDate,
        status:"pending"
      })
      .select()
      .single();

  if(albumResult.error){

    showToast(albumResult.error.message);

    return;
  }

  const album = albumResult.data;

  for(let i=0;i<audioFiles.length;i++){

    const file = audioFiles[i];

    const extension =
      file.name.split(".").pop();

    const audioPath =
      `${user.id}/${crypto.randomUUID()}.${extension}`;

    const upload =
      await supabase.storage
        .from("music")
        .upload(audioPath,file,{
          upsert:false
        });

    if(upload.error){

      showToast(
        `Audio upload failed: ${upload.error.message}`
      );

      return;
    }

    const songResult =
      await supabase
        .from("songs")
        .insert({
          artist_id:user.id,
          album_id:album.id,
          title:
            type === "single" && audioFiles.length === 1
              ? title
              : file.name.replace(/\.[^/.]+$/,""),
          audio_path:audioPath,
          cover_path:coverPath,
          status:"pending",
          track_number:i+1,
          disc_number:1
        });

    if(songResult.error){

      showToast(songResult.error.message);

      return;
    }
  }

  closeModal("releaseModal");

  showToast(
    "Release submitted. It is waiting for admin approval."
  );

  renderArtistStudio();
}

    return;
  }

  window.open(url,"_blank");
}

        >
      </div>

        <label>Bio</label>

        <textarea id="settingsBio">${escapeHtml(bio)}</textarea>
      </div>

          value="${escapeHtml(user.email || "")}"

      </button>

  `;
}


async function saveSettings(){

  if(!user) return;

  const name =
    document.getElementById("settingsName").value.trim();

  const avatar =
    document.getElementById("settingsAvatar").value.trim();

  const bio =
    document.getElementById("settingsBio").value.trim();

  if(!name){

    showToast("Display name cannot be empty.");

    return;
  }

  const result =
    await supabase
      .from("profiles")
      .update({
        display_name:name,
        avatar_url:avatar || null,
        bio:bio || null
      })
      .eq("id",user.id);

  if(result.error){

    showToast(
      "Could not save settings. Make sure the avatar_url and bio columns exist in profiles."
    );

    return;
  }

  await loadUserData();

  renderTopActions();

  showToast("Settings saved.");

  renderSettings();
}

    document.getElementById("pageContent").innerHTML = `
      <div class="empty">
        Admin access required.
      </div>
    `;

    return;
  }

  const container =
    document.getElementById("pageContent");

  container.innerHTML = `

    <div class="page-title">
      <h1>Admin Dashboard</h1>
      <p>Manage Afrova verification and music submissions.</p>
    </div>

    <div class="admin-banner">

      <h2>Afrova Administrator</h2>

      <p>
        ${escapeHtml(
          profile?.display_name ||
          user.email ||
          "Administrator"
        )}
        · ${escapeHtml(user.email || "")}
      </p>

      <span class="role-pill" style="margin-top:12px;background:#1e293b;color:#93c5fd">
        ADMIN
      </span>

    </div>

    <div id="adminStats" class="admin-stats">
      <div class="empty">Loading statistics...</div>
    </div>

    <div class="admin-tabs">

      <button
        class="admin-tab active"

async function loadAdminStats(){

  const result =
    await supabase
      .rpc("get_admin_stats");

  const el =
    document.getElementById("adminStats");

  if(!el) return;

  if(result.error){

    el.innerHTML = `
      <div class="empty">
        ${escapeHtml(result.error.message)}
      </div>
    `;

    return;
  }

  const stats =
    result.data || {};

  el.innerHTML = `

    <div class="admin-stat">
      <strong>${Number(stats.users || 0).toLocaleString()}</strong>
      <span>Total users</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.artists || 0).toLocaleString()}</strong>
      <span>Artists</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.pending_artists || 0).toLocaleString()}</strong>
      <span>Pending artists</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.songs || 0).toLocaleString()}</strong>
      <span>Songs</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.pending_songs || 0).toLocaleString()}</strong>
      <span>Pending songs</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.albums || 0).toLocaleString()}</strong>
      <span>Albums</span>
    </div>

    <div class="admin-stat">
      <strong>${Number(stats.pending_students || 0).toLocaleString()}</strong>
      <span>Pending students</span>
    </div>
  `;
}


async function loadAdminTab(type,button){

  document.querySelectorAll(".admin-tab")
    .forEach(x => x.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  const el =
    document.getElementById("adminList");

  if(!el) return;

  el.innerHTML =
    `<div class="empty">Loading...</div>`;

  if(type === "artists"){

    await loadAdminArtists();

  }else if(type === "students"){

    await loadAdminStudents();

  }else if(type === "songs"){

    await loadAdminSongs();

  }else if(type === "albums"){

    await loadAdminAlbums();
  }
}


async function loadAdminArtists(){

  const result =
    await supabase
      .from("artist_profiles")
      .select("*")
      .eq("verification_status","pending")
      .order("created_at",{ascending:true});

  const el =
    document.getElementById("adminList");

  if(!result.data?.length){

    el.innerHTML = `
      <div class="empty">
        There are no pending artist applications right now.
      </div>
    `;

    return;
  }

  el.innerHTML =
    result.data.map(artist => `

      <div class="admin-item">

        <div class="avatar">
          ${escapeHtml(initials(artist.artist_name))}
        </div>

        <div class="admin-item-main">

          <strong>
            ${escapeHtml(artist.artist_name)}
          </strong>

          <small>
            Artist application
          </small>

          <small>
            ${escapeHtml(
              artist.bio ||
              "No biography supplied."
            )}
          </small>

          <small>
            Applied:
            ${new Date(artist.created_at).toLocaleDateString()}
          </small>

        </div>

        <div class="admin-actions">

          <button
            class="btn btn-success btn-small"
            onclick="reviewArtist('${artist.id}','approved')"
          >
            Approve
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="reviewArtist('${artist.id}','rejected')"
          >
            Reject
          </button>

        </div>

      </div>

    `).join("");
}


async function reviewArtist(artistId,status){

  const note =
    status === "approved"
      ? "Approved by Afrova administration."
      : "Application was not approved.";

  const result =
    await supabase
      .rpc("admin_review_artist",{
        requested_artist_id:artistId,
        requested_status:status,
        requested_note:note
      });

  if(result.error){

    showToast(result.error.message);

    return;
  }

  showToast(
    status === "approved"
      ? "Artist approved successfully."
      : "Artist application rejected."
  );

  await loadUserData();

  await loadAdminStats();

  await loadAdminArtists();
}


async function loadAdminStudents(){

  const result =
    await supabase
      .from("student_verifications")
      .select(`
        *,
        profiles (
          display_name
        )
      `)
      .eq("status","pending")
      .order("created_at",{ascending:true});

  const el =
    document.getElementById("adminList");

  if(!result.data?.length){

    el.innerHTML = `
      <div class="empty">
        No pending student verification applications.
      </div>
    `;

    return;
  }

  el.innerHTML =
    result.data.map(item => `

      <div class="admin-item">

        <div class="avatar">
          ${escapeHtml(
            initials(
              item.profiles?.display_name ||
              "Student"
            )
          )}
        </div>

        <div class="admin-item-main">

          <strong>
            ${escapeHtml(
              item.profiles?.display_name ||
              "Student"
            )}
          </strong>

          <small>
            Student verification
          </small>

          <small>
            Document:
            ${escapeHtml(item.document_path || "")}
          </small>

          <small>
            Submitted:
            ${new Date(item.created_at).toLocaleDateString()}
          </small>

        </div>

        <div class="admin-actions">

          <button
            class="btn btn-success btn-small"
            onclick="reviewStudent('${item.id}','approved')"
          >
            Approve
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="reviewStudent('${item.id}','rejected')"
          >
            Reject
          </button>

        </div>

      </div>

    `).join("");
}


async function reviewStudent(id,status){

  const result =
    await supabase
      .from("student_verifications")
      .update({
        status,
        review_note:
          status === "approved"
            ? "Approved by Afrova administration."
            : "Student verification rejected.",
        reviewed_by:user.id,
        reviewed_at:new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    showToast(result.error.message);

    return;
  }

  showToast(
    status === "approved"
      ? "Student verification approved."
      : "Student verification rejected."
  );

  await loadAdminStats();

  await loadAdminStudents();
}

  const result =
    await supabase
      .from("songs")
      .select(`
        *,
        artist_profiles (
          artist_name,
          verification_status
        )
      `)
      .eq("status","pending")
      .order("created_at",{ascending:true});

  const el =
    document.getElementById("adminList");

    el.innerHTML = `
      <div class="empty">

      </div>

  el.innerHTML =
    result.data.map(song => `

        <div class="admin-item-main">

          <strong>
            ${escapeHtml(song.title)}
          </strong>

          <small>
            Artist:
            ${escapeHtml(
              song.artist_profiles?.artist_name ||
              "Unknown"
            )}
          </small>

          <small>
            Genre:
            ${escapeHtml(song.genre || "Not specified")}
          </small>

        </div>

        <div class="admin-actions">

          <button
            class="btn btn-success btn-small"
            onclick="reviewSong('${song.id}','published')"
          >
            Publish
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="reviewSong('${song.id}','rejected')"
          >
            Reject
          </button>

        </div>

      </div>

    `).join("");
}


async function reviewSong(id,status){

  const result =
    await supabase
      .from("songs")
      .update({
        status
      })
      .eq("id",id);

  if(result.error){

    showToast(result.error.message);

    return;
  }

  showToast(
    status === "published"
      ? "Song published."
      : "Song rejected."
  );

  await loadAdminStats();

  await loadAdminSongs();
}


async function loadAdminAlbums(){

  const result =
    await supabase
      .from("albums")
      .select(`
        *,
        artist_profiles (
          artist_name,
          verification_status
        )
      `)
      .eq("status","pending")
      .order("created_at",{ascending:true});

  const el =
    document.getElementById("adminList");

  if(!result.data?.length){

    el.innerHTML = `
      <div class="empty">
        No pending albums or EPs.
      </div>
    `;

    return;
  }

  el.innerHTML =
    result.data.map(album => `

      <div class="admin-item">

        <div class="admin-item-main">

          <strong>
            ${escapeHtml(album.title)}
          </strong>

          <small>
            Type:
            ${escapeHtml(album.release_type)}
          </small>

          <small>
            Artist:
            ${escapeHtml(
              album.artist_profiles?.artist_name ||
              "Unknown"
            )}
          </small>

        </div>

        <div class="admin-actions">

          <button
            class="btn btn-success btn-small"
            onclick="reviewAlbum('${album.id}','published')"
          >
            Publish
          </button>

          <button
            class="btn btn-danger btn-small"
            onclick="reviewAlbum('${album.id}','rejected')"
          >
            Reject
          </button>

        </div>

      </div>

    `).join("");
}


async function reviewAlbum(id,status){

  const result =
    await supabase
      .from("albums")
      .update({
        status
      })
      .eq("id",id);

  if(result.error){

    showToast(result.error.message);

    return;
  }

  /*
    When an album is approved, its songs are also published.
  */

  if(status === "published"){

    await supabase
      .from("songs")
      .update({
        status:"published"
      })
      .eq("album_id",id)
      .eq("status","pending");
  }

  if(status === "rejected"){

    await supabase
      .from("songs")
      .update({
        status:"rejected"
      })
      .eq("album_id",id)
      .eq("status","pending");
  }

  showToast(
    status === "published"
      ? "Album published."
      : "Album rejected."
  );

  await loadAdminStats();

  await loadAdminAlbums();
}
