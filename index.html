<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afrova</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#111115;padding:24px;position:fixed;left:0;top:0;bottom:0}
.logo{font-size:30px;font-weight:800;margin-bottom:30px}
.logo span{color:#8b5cf6}
.nav button{display:block;width:100%;padding:13px;margin:6px 0;background:none;border:0;color:#aaa;text-align:left;border-radius:10px}
.nav button:hover,.nav button.active{background:#242027;color:#fff}
.main{margin-left:240px;width:calc(100% - 240px);padding-bottom:110px}
.topbar{height:70px;background:#101014;display:flex;align-items:center;gap:15px;padding:12px 28px;position:sticky;top:0;z-index:10}
.search{flex:1;max-width:600px;background:#222229;border:1px solid #333;border-radius:30px;padding:13px 18px;color:#fff;outline:0}
.account-btn,.primary{background:#8b5cf6;color:white;border:0;border-radius:25px;padding:11px 18px;font-weight:700}
.secondary{background:#25252d;color:white;border:1px solid #444;border-radius:10px;padding:10px 15px}
.content{padding:30px}
.hero{background:linear-gradient(135deg,#29134d,#15151c);padding:45px;border-radius:22px;margin-bottom:30px}
.hero h1{font-size:44px;margin:0 0 10px}
.hero p{color:#bbb;max-width:600px}
h2{margin-top:35px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{background:#151519;border:1px solid #26262d;border-radius:15px;padding:14px;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:#555}
.cover{width:100%;aspect-ratio:1;border-radius:11px;background:#25252d;object-fit:cover}
.card h3{font-size:16px;margin:10px 0 5px}
.card p{margin:0;color:#999;font-size:13px}
.card-actions{display:flex;gap:7px;margin-top:12px}
.card-actions button{flex:1}
.song-row{display:flex;align-items:center;gap:14px;padding:10px;border-radius:10px}
.song-row:hover{background:#19191f}
.song-row img{width:52px;height:52px;object-fit:cover;border-radius:7px}
.song-info{flex:1}
.song-info strong{display:block}
.song-info small{color:#999}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#29222f;color:#c4a7ff;font-size:12px}
.badge.green{background:#163522;color:#6ee7a1}
.badge.yellow{background:#403515;color:#facc15}
.badge.red{background:#401c1c;color:#f87171}
.player{position:fixed;left:240px;right:0;bottom:0;background:#151519;border-top:1px solid #333;padding:12px 22px;display:flex;align-items:center;gap:15px;z-index:20}
.player img{width:48px;height:48px;border-radius:7px;object-fit:cover}
.player-info{min-width:150px}
.player-info strong{display:block}
.player-info small{color:#999}
.player button{background:none;border:0;color:white;font-size:20px}
.progress{flex:1}
.progress input{width:100%}
.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100}
.modal{background:#18181d;width:min(650px,94%);max-height:90vh;overflow:auto;border-radius:18px;padding:25px}
.modal h2{margin-top:0}
.field{margin:14px 0}
.field label{display:block;color:#aaa;font-size:13px;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:#24242b;border:1px solid #444;color:white;padding:12px;border-radius:9px;outline:0}
.field textarea{min-height:100px}
.close{float:right;background:none;border:0;color:#aaa;font-size:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{background:#222229;border:1px solid #333;color:#ccc;border-radius:20px;padding:9px 14px}
.tabs button.active{background:#8b5cf6;color:#fff}
.admin-stat{background:#17171c;padding:20px;border-radius:14px;border:1px solid #292930}
.admin-stat strong{font-size:30px;display:block;margin-top:8px}
.track-input{display:grid;grid-template-columns:45px 1fr 1fr;gap:8px;margin:8px 0;align-items:center}
.track-input span{color:#aaa;text-align:center}
.release-card{margin:12px 0;padding:15px;background:#151519;border:1px solid #2a2a30;border-radius:12px}
.empty{padding:35px;text-align:center;color:#888;background:#141419;border-radius:14px}
.hidden{display:none!important}
@media(max-width:800px){
.sidebar{width:70px;padding:15px 8px}
.logo{font-size:18px;text-align:center}
.nav button{font-size:0;text-align:center}
.nav button:first-letter{font-size:20px}
.main{margin-left:70px;width:calc(100% - 70px)}
.player{left:70px}
.content{padding:18px}
.hero h1{font-size:32px}
.topbar{padding:10px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">Afro<span>va</span></div>

  <nav class="nav">
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('search')">🔎 Search</button>
    <button onclick="showPage('liked')">❤️ Liked Songs</button>
    <button onclick="showPage('playlists')">📋 Playlists</button>
    <button onclick="showPage('albums')">💿 Albums</button>
    <button onclick="showPage('artist')">🎤 Artist Studio</button>
    <button onclick="showPage('premium')">⭐ Premium</button>
    <button id="adminNav" class="hidden" onclick="showPage('admin')">🛡️ Admin</button>
  </nav>
</aside>

<main class="main">

<header class="topbar">
  <input id="topSearch" class="search" placeholder="Search songs, artists, albums..." oninput="quickSearch(this.value)">
  <button class="account-btn" onclick="openAccount()">Account</button>
</header>

<section id="content" class="content"></section>

</main>
</div>

<div class="player">
  <img id="playerCover" src="" alt="">
  <div class="player-info">
    <strong id="playerTitle">Nothing playing</strong>
    <small id="playerArtist">Afrova</small>
  </div>
  <button onclick="previousSong()">⏮</button>
  <button onclick="togglePlay()">▶️</button>
  <button onclick="nextSong()">⏭</button>
  <div class="progress">
    <input id="seek" type="range" min="0" max="100" value="0" oninput="seekSong(this.value)">
  </div>
</div>

<audio id="audio"></audio>

<!-- ACCOUNT MODAL -->
<div class="modal-bg" id="accountModal">
<div class="modal">
<button class="close" onclick="closeModal('accountModal')">×</button>
<div id="accountContent"></div>
</div>
</div>

<!-- RELEASE MODAL -->
<div class="modal-bg" id="releaseModal">
<div class="modal">
<button class="close" onclick="closeModal('releaseModal')">×</button>

<h2>Create Release</h2>

<div class="field">
<label>Release type</label>
<select id="releaseType">
<option value="single">Single</option>
<option value="ep">EP</option>
<option value="album">Album</option>
</select>
</div>

<div class="field">
<label>Title</label>
<input id="releaseTitle" placeholder="Release title">
</div>

<div class="field">
<label>Cover artwork</label>
<input id="releaseCover" type="file" accept="image/*">
</div>

<div class="field">
<label>Release date</label>
<input id="releaseDate" type="date">
</div>

<h3>Tracks</h3>
<div id="trackInputs"></div>

<button class="secondary" onclick="addTrackInput()">＋ Add Track</button>
<br><br>
<button class="primary" onclick="createRelease()">Create Release</button>

</div>
</div>

<!-- STUDENT MODAL -->
<div class="modal-bg" id="studentModal">
<div class="modal">
<button class="close" onclick="closeModal('studentModal')">×</button>
<h2>Student Verification</h2>

<p style="color:#aaa">
Submit your school ID or admission document for Afrova student verification.
Your document will be reviewed by Afrova administration.
</p>

<div class="field">
<label>Verification document</label>
<input id="studentDocument" type="file" accept="image/*,.pdf">
</div>

<button class="primary" onclick="submitStudentVerification()">
Submit for verification
</button>
</div>
</div>

<script>
/* =========================================================
   AFROVA CONFIG
========================================================= */

const SUPABASE_URL =
"https://eeurywspkbqbxayoyexi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ajf06QZRdqJULjf9QOT-yw_6LCjkA86";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const PAYSTACK_LINKS = {
  student:"https://paystack.shop/pay/k0jf1wizby",
  individual:"https://paystack.shop/pay/w0ov-s1tir",
  duo:"https://paystack.shop/pay/7a78ikzfmy",
  family:"https://paystack.shop/pay/47wwryj73v"
};

let currentUser = null;
let currentProfile = null;
let currentArtist = null;
let songs = [];
let albums = [];
let currentSongIndex = -1;
let currentSong = null;
let liked = JSON.parse(localStorage.getItem("afrova_liked") || "[]");
let trackNumber = 0;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function closeModal(id){
  document.getElementById(id).style.display="none";
}

function openModal(id){
  document.getElementById(id).style.display="flex";
}

function formatDate(date){
  if(!date) return "";
  return new Date(date).toLocaleDateString();
}

function showMessage(message){
  alert(message);
}


/* =========================================================
   AUTH
========================================================= */

async function checkLogin(){

  const {data} = await sb.auth.getSession();

  currentUser = data.session?.user || null;

  if(currentUser){
    await loadProfile();
  }

  updateAdminButton();
}

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} = await sb
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  currentProfile=data;

  if(currentProfile?.role === "artist"){
    await loadArtistProfile();
  }

  if(currentProfile?.role === "admin"){
    document.getElementById("adminNav").classList.remove("hidden");
  }
}

async function loadArtistProfile(){

  const {data} = await sb
    .from("artist_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentArtist=data;
}

function updateAdminButton(){

  const btn=document.getElementById("adminNav");

  if(currentProfile?.role==="admin"){
    btn.classList.remove("hidden");
  }else{
    btn.classList.add("hidden");
  }
}

async function signup(){

  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;

  if(!name || !email || !password){
    showMessage("Please complete all fields.");
    return;
  }

  if(password.length < 6){
    showMessage("Password must be at least 6 characters.");
    return;
  }

  const redirect =
    window.location.href.split("#")[0].split("?")[0];

  const {data,error}=await sb.auth.signUp({
    email,
    password,
    options:{
      data:{display_name:name},
      emailRedirectTo:redirect
    }
  });

  if(error){
    showMessage(error.message);
    return;
  }

  if(data.user){
    await sb.from("profiles").upsert({
      id:data.user.id,
      display_name:name,
      role:"listener"
    });
  }

  showMessage(
    "Account created. Please check your email and click the confirmation link before logging in."
  );

  showLoginForm();
}

async function login(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  const {data,error}=await sb.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMessage(error.message);
    return;
  }

  currentUser=data.user;

  await loadProfile();

  closeModal("accountModal");

  showPage("home");
}

async function logout(){

  await sb.auth.signOut();

  currentUser=null;
  currentProfile=null;
  currentArtist=null;

  updateAdminButton();

  closeModal("accountModal");

  showPage("home");
}


/* =========================================================
   ACCOUNT UI
========================================================= */

function openAccount(){

  openModal("accountModal");

  if(!currentUser){
    showLoginForm();
  }else{
    showLoggedInAccount();
  }
}

function showLoginForm(){

  document.getElementById("accountContent").innerHTML=`
    <h2>Login to Afrova</h2>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password">
    </div>

    <button class="primary" onclick="login()">Login</button>

    <p style="color:#999">
      Don't have an account?
      <button class="secondary" onclick="showSignupForm()">Create account</button>
    </p>
  `;
}

function showSignupForm(){

  document.getElementById("accountContent").innerHTML=`
    <h2>Create Afrova Account</h2>

    <div class="field">
      <label>Name</label>
      <input id="signupName">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="signupEmail" type="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="signupPassword" type="password">
    </div>

    <button class="primary" onclick="signup()">Create Account</button>

    <p style="color:#999">
      Already have an account?
      <button class="secondary" onclick="showLoginForm()">Login</button>
    </p>
  `;
}

function showLoggedInAccount(){

  const admin=currentProfile?.role==="admin";

  document.getElementById("accountContent").innerHTML=`
    <h2>My Account</h2>

    <p>
      <strong>${escapeHtml(
        currentProfile?.display_name ||
        currentUser.email
      )}</strong>
    </p>

    <p style="color:#999">
      ${escapeHtml(currentUser.email)}
    </p>

    <p>
      Account:
      <span class="badge">${escapeHtml(currentProfile?.role || "listener")}</span>
    </p>

    ${admin ? `
      <button class="primary" onclick="closeModal('accountModal');showPage('admin')">
        Open Admin Dashboard
      </button>
    ` : ""}

    <br><br>

    <button class="secondary" onclick="logout()">Logout</button>
  `;
}


/* =========================================================
   PAGES
========================================================= */

async function showPage(page){

  const content=document.getElementById("content");

  if(page==="home"){
    renderHome();
  }

  if(page==="search"){
    renderSearch();
  }

  if(page==="liked"){
    renderLiked();
  }

  if(page==="albums"){
    await renderAlbums();
  }

  if(page==="playlists"){
    content.innerHTML=`
      <h1>Playlists</h1>
      <div class="empty">
        Playlist creation is coming next.
      </div>
    `;
  }

  if(page==="artist"){
    await renderArtistStudio();
  }

  if(page==="premium"){
    await renderPremium();
  }

  if(page==="admin"){
    if(currentProfile?.role!=="admin"){
      showMessage("Admin access required.");
      return;
    }

    await renderAdmin();
  }
}


/* =========================================================
   SONGS
========================================================= */

async function loadPublishedSongs(){

  const {data,error}=await sb
    .from("songs")
    .select("*")
    .eq("status","published")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  songs=data || [];

  const artistIds=[
    ...new Set(songs.map(s=>s.artist_id).filter(Boolean))
  ];

  if(!artistIds.length) return;

  const {data:artists}=await sb
    .from("artist_profiles")
    .select("id,artist_name")
    .in("id",artistIds);

  const map={};

  (artists || []).forEach(a=>{
    map[a.id]=a.artist_name;
  });

  songs=songs.map(s=>({
    ...s,
    artist_name:map[s.artist_id] || "Unknown Artist"
  }));
}

function renderSongCard(song){

  const cover=song.cover_path
    ? publicUrl("covers",song.cover_path)
    : "";

  const isLiked=liked.includes(song.id);

  return `
    <div class="card">

      ${
        cover
        ? `<img class="cover" src="${escapeHtml(cover)}">`
        : `<div class="cover"></div>`
      }

      <h3>${escapeHtml(song.title)}</h3>

      <p>${escapeHtml(song.artist_name || "Artist")}</p>

      <div class="card-actions">

        <button class="primary"
          onclick="playSongById('${song.id}')">
          ▶
        </button>

        <button class="secondary"
          onclick="toggleLike('${song.id}')">
          ${isLiked ? "❤️" : "♡"}
        </button>

      </div>

    </div>
  `;
}

function renderHome(){

  document.getElementById("content").innerHTML=`

    <div class="hero">
      <h1>Welcome to Afrova</h1>
      <p>
        Discover African music, support artists and enjoy your favourite songs.
      </p>
      <button class="primary" onclick="showPage('search')">
        Explore Music
      </button>
    </div>

    <h2>Trending Songs</h2>

    <div class="grid">
      ${
        songs.length
        ? songs.slice(0,8).map(renderSongCard).join("")
        : `<div class="empty">No published songs yet.</div>`
      }
    </div>

    <h2>Albums & EPs</h2>

    <div id="homeAlbums" class="grid">
      Loading releases...
    </div>

  `;

  renderHomeAlbums();
}

async function renderHomeAlbums(){

  const {data}=await sb
    .from("albums")
    .select("*")
    .eq("status","published")
    .order("created_at",{ascending:false})
    .limit(8);

  albums=data || [];

  const container=document.getElementById("homeAlbums");

  if(!container) return;

  if(!albums.length){
    container.innerHTML=`
      <div class="empty">
        No albums or EPs published yet.
      </div>
    `;
    return;
  }

  container.innerHTML=albums.map(renderAlbumCard).join("");
}

function renderAlbumCard(album){

  const cover=album.cover_path
    ? publicUrl("covers",album.cover_path)
    : "";

  return `
    <div class="card" onclick="openAlbum('${album.id}')">

      ${
        cover
        ? `<img class="cover" src="${escapeHtml(cover)}">`
        : `<div class="cover"></div>`
      }

      <h3>${escapeHtml(album.title)}</h3>

      <p>${escapeHtml(
        album.release_type.toUpperCase()
      )}</p>

      <p>${formatDate(album.release_date)}</p>

    </div>
  `;
}


/* =========================================================
   SEARCH
========================================================= */

function quickSearch(value){

  if(value.trim()){
    showPage("search");
    searchSongs(value);
  }
}

async function searchSongs(query){

  const q=query.trim().toLowerCase();

  if(!q){
    renderSearch();
    return;
  }

  const results=songs.filter(song=>
    song.title.toLowerCase().includes(q) ||
    (song.artist_name || "").toLowerCase().includes(q)
  );

  const albumResults=albums.filter(album=>
    album.title.toLowerCase().includes(q)
  );

  document.getElementById("content").innerHTML=`

    <h1>Search</h1>

    <h2>Songs</h2>

    <div class="grid">
      ${
        results.length
        ? results.map(renderSongCard).join("")
        : `<div class="empty">No songs found.</div>`
      }
    </div>

    <h2>Albums & EPs</h2>

    <div class="grid">
      ${
        albumResults.length
        ? albumResults.map(renderAlbumCard).join("")
        : `<div class="empty">No releases found.</div>`
      }
    </div>

  `;
}

function renderSearch(){

  document.getElementById("content").innerHTML=`
    <h1>Search Afrova</h1>
    <p style="color:#999">
      Search for songs, artists or albums using the search bar above.
    </p>

    <div class="grid">
      ${songs.slice(0,12).map(renderSongCard).join("")}
    </div>
  `;
}


/* =========================================================
   LIKES
========================================================= */

function toggleLike(id){

  if(liked.includes(id)){
    liked=liked.filter(x=>x!==id);
  }else{
    liked.push(id);
  }

  localStorage.setItem(
    "afrova_liked",
    JSON.stringify(liked)
  );

  showPage("home");
}

function renderLiked(){

  const result=songs.filter(s=>liked.includes(s.id));

  document.getElementById("content").innerHTML=`

    <h1>Liked Songs</h1>

    <div class="grid">
      ${
        result.length
        ? result.map(renderSongCard).join("")
        : `<div class="empty">You haven't liked any songs yet.</div>`
      }
    </div>

  `;
}


/* =========================================================
   ALBUMS
========================================================= */

async function renderAlbums(){

  const {data,error}=await sb
    .from("albums")
    .select("*")
    .eq("status","published")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
  }

  albums=data || [];

  document.getElementById("content").innerHTML=`

    <h1>Albums & EPs</h1>

    <div class="grid">
      ${
        albums.length
        ? albums.map(renderAlbumCard).join("")
        : `<div class="empty">No published albums or EPs yet.</div>`
      }
    </div>

  `;
}

async function openAlbum(id){

  const {data:album}=await sb
    .from("albums")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  if(!album) return;

  const {data:artist}=await sb
    .from("artist_profiles")
    .select("*")
    .eq("id",album.artist_id)
    .maybeSingle();

  const {data:tracks,error}=await sb
    .rpc("get_album_tracks",{
      requested_album_id:id
    });

  if(error){
    console.error(error);
  }

  const cover=album.cover_path
    ? publicUrl("covers",album.cover_path)
    : "";

  document.getElementById("content").innerHTML=`

    <button class="secondary" onclick="showPage('albums')">
      ← Albums
    </button>

    <div class="hero" style="margin-top:20px">

      <div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap">

        ${
          cover
          ? `<img src="${escapeHtml(cover)}"
               style="width:200px;height:200px;object-fit:cover;border-radius:15px">`
          : `<div class="cover" style="width:200px"></div>`
        }

        <div>
          <span class="badge">
            ${escapeHtml(album.release_type.toUpperCase())}
          </span>

          <h1>${escapeHtml(album.title)}</h1>

          <p>
            ${escapeHtml(artist?.artist_name || "Artist")}
          </p>

          <p style="color:#999">
            ${formatDate(album.release_date)}

/* =========================================================
   AUDIO PLAYER
========================================================= */

function publicUrl(bucket,path){

  if(!path) return "";

  const {data}=sb.storage
    .from(bucket)
    .getPublicUrl(path);

  return data.publicUrl;
}

function playSongById(id){

  const index=songs.findIndex(s=>s.id===id);

  if(index<0) return;

  currentSongIndex=index;

  playSong(songs[index]);
}

function playTrackObject(track){

  playSong({
    ...track,
    id:track.song_id,
    artist_name:"Artist"
  });
}

function playSong(song){

  currentSong=song;

  const url=publicUrl("music",song.audio_path);

  document.getElementById("audio").src=url;

  document.getElementById("playerTitle").textContent=
    song.title || "Unknown";

  document.getElementById("playerArtist").textContent=
    song.artist_name || "Artist";

  document.getElementById("playerCover").src=
    song.cover_path
    ? publicUrl("covers",song.cover_path)
    : "";

  document.getElementById("audio").play()
    .catch(()=>showMessage(
      "This song could not be played. Check that the audio file exists."
    ));

  recordStreamLater(song);
}

function togglePlay(){

  const audio=document.getElementById("audio");

  if(!audio.src){
    return;
  }

  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}

function nextSong(){

  if(!songs.length) return;

  currentSongIndex++;

  if(currentSongIndex>=songs.length){
    currentSongIndex=0;
  }

  playSong(songs[currentSongIndex]);
}

function previousSong(){

  if(!songs.length) return;

  currentSongIndex--;

  if(currentSongIndex<0){
    currentSongIndex=songs.length-1;
  }

  playSong(songs[currentSongIndex]);
}

function seekSong(value){

  const audio=document.getElementById("audio");

  if(audio.duration){
    audio.currentTime=
      (value/100)*audio.duration;
  }
}

document.getElementById("audio")
.addEventListener("timeupdate",()=>{

  const audio=document.getElementById("audio");

  if(audio.duration){
    document.getElementById("seek").value=
      (audio.currentTime/audio.duration)*100;
  }
});

document.getElementById("audio")
.addEventListener("ended",nextSong);

========================================================= */

const recordedStreams=new Set();

function recordStreamLater(song){

  if(!currentUser || !song?.id) return;

  const id=song.id;

  if(recordedStreams.has(id)) return;

  recordedStreams.add(id);

  setTimeout(async()=>{

    const {error}=await sb
      .from("song_streams")
      .insert({
        song_id:id,
        listener_id:currentUser.id
      });

    if(error){
      console.error("Stream recording error:",error);
    }

  },30000);
}

async function createRelease(){

  if(!currentUser || !currentArtist){
    showMessage("Artist account required.");
    return;
  }

  if(currentArtist.verification_status!=="approved"){
    showMessage("Artist verification is required.");
    return;
  }

  const title=document
    .getElementById("releaseTitle")
    .value.trim();

  const type=document
    .getElementById("releaseType")
    .value;

  const releaseDate=document
    .getElementById("releaseDate")
    .value || null;

  const coverFile=document
    .getElementById("releaseCover")
    .files[0];

  if(!title){
    showMessage("Enter a release title.");
    return;
  }

  const titleInputs=[
    ...document.querySelectorAll(".track-title")
  ];

  const fileInputs=[
    ...document.querySelectorAll(".track-file")
  ];

  if(!titleInputs.length){
    showMessage("Add at least one track.");
    return;
  }

  if(type==="single" && titleInputs.length!==1){
    showMessage("A single must contain exactly one track.");
    return;
  }

  for(let i=0;i<titleInputs.length;i++){

    if(!titleInputs[i].value.trim()){
      showMessage(`Enter a title for track ${i+1}.`);
      return;
    }

    if(!fileInputs[i].files[0]){
      showMessage(`Choose an audio file for track ${i+1}.`);
      return;
    }
  }

  let coverPath=null;

  if(coverFile){

    const extension=
      coverFile.name.split(".").pop();

    coverPath=
      `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

    const {error}=await sb.storage
      .from("covers")
      .upload(coverPath,coverFile);

    if(error){
      showMessage("Cover upload failed: "+error.message);
      return;
    }
  }

  const {data:album,error:albumError}=await sb
    .from("albums")
    .insert({
      artist_id:currentUser.id,
      title,
      release_type:type,
      cover_path:coverPath,
      release_date:releaseDate,
      status:"pending"
    })
    .select()
    .single();

  if(albumError){
    showMessage(albumError.message);
    return;
  }

  for(let i=0;i<titleInputs.length;i++){

    const file=fileInputs[i].files[0];

    const extension=
      file.name.split(".").pop();

    const audioPath=
      `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

    const {error:uploadError}=await sb.storage
      .from("music")
      .upload(audioPath,file);

    if(uploadError){

      showMessage(
        `Track ${i+1} upload failed: ${uploadError.message}`
      );

      return;
    }

    const {error:songError}=await sb
      .from("songs")
      .insert({
        artist_id:currentUser.id,
        album_id:album.id,
        title:titleInputs[i].value.trim(),
        audio_path:audioPath,
        cover_path:coverPath,
        track_number:i+1,
        disc_number:1,
        status:"pending"
      });

    if(songError){
      showMessage(
        `Track ${i+1} could not be saved: ${songError.message}`
      );
      return;
    }
  }

  closeModal("releaseModal");

  showMessage(
    "Release submitted successfully. It is now waiting for Afrova admin approval."
  );

  renderArtistStudio();
}

    .from("albums")
    .update({status})
    .eq("id",id);

    showMessage(error.message);
    return;

  /*

      .from("songs")
      .update({status:"rejected"})
      .eq("album_id",id);

  }

  showMessage("Release status updated.");

  adminAlbums();
}


/* =========================================================
   ADMIN STUDENTS
========================================================= */

async function adminStudents(){

  const {data,error}=await sb
    .from("student_verifications")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    showMessage(error.message);
    return;
  }

  document.getElementById("adminPanel").innerHTML=`

    <h2>Student Verification</h2>

    ${
      data?.length
      ? data.map(student=>`

        <div class="release-card">

          <h3>Student verification</h3>

          <p>
            User:
            ${escapeHtml(student.user_id)}
          </p>

          <p>
            ${statusBadge(student.status)}
          </p>

          <p style="color:#999">
            Submitted:
            ${formatDate(student.created_at)}
          </p>

          ${
            student.status!=="approved"
            ? `
              <button class="primary"
                onclick="setStudentStatus('${student.id}','approved')">
                Approve
              </button>
            `
            : ""
          }

          ${
            student.status!=="rejected"
            ? `
              <button class="secondary"
                onclick="setStudentStatus('${student.id}','rejected')">
                Reject
              </button>
            `
            : ""
          }

        </div>

      `).join("")
      : `<div class="empty">No student verification requests.</div>`
    }

  `;
}

async function setStudentStatus(id,status){

  const {error}=await sb
    .from("student_verifications")
    .update({
      status,
      reviewed_by:currentUser.id,
      reviewed_at:new Date().toISOString()
    })
    .eq("id",id);

  if(error){
    showMessage(error.message);
    return;
  }

  showMessage("Student verification updated.");

  adminStudents();
}


/* =========================================================
   INITIALIZATION
========================================================= */

sb.auth.onAuthStateChange(async(event,session)=>{

  currentUser=session?.user || null;

  if(currentUser){
    await loadProfile();
  }else{
    currentProfile=null;
    currentArtist=null;
  }

  updateAdminButton();
});

(async function(){

  await checkLogin();

  await loadPublishedSongs();

  await renderAlbums();

  showPage("home");

})();
</script>
