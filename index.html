<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Afrova — Your Music. Your Sound.</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070b12;
  --panel:#0d131d;
  --panel2:#111a27;
  --line:#1e2a3a;
  --text:#f5f8fc;
  --muted:#8d9aad;
  --blue:#1683ff;
  --blue2:#0d6fe0;
  --danger:#ff5364;
  --green:#35d07f;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.app{display:flex;min-height:100vh;padding-bottom:90px}

.sidebar{
  width:245px;
  background:#080d15;
  border-right:1px solid var(--line);
  position:fixed;
  top:0;bottom:0;left:0;
  padding:22px 15px;
  z-index:20;
  overflow-y:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:800;
  padding:5px 10px 28px;
}
.logo-mark{
  width:34px;height:34px;
  border-radius:10px;
  background:var(--blue);
  display:grid;
  place-items:center;
  font-weight:900;
}

.nav-title{
  color:#637084;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.3px;
  padding:12px 11px 8px;
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb9c8;
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 11px;
  border-radius:11px;
  margin:2px 0;
  text-align:left;
}
.nav button:hover,.nav button.active{
  background:#121c2a;
  color:white;
}
.icon{
  width:19px;height:19px;
  display:inline-grid;
  place-items:center;
  flex:none;
}
.icon svg{width:19px;height:19px}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
}

.topbar{
  height:76px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 28px;
  border-bottom:1px solid rgba(255,255,255,.04);
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(7,11,18,.92);
  backdrop-filter:blur(16px);
}

.search{
  flex:1;
  max-width:620px;
  position:relative;
}
.search input{
  width:100%;
  background:#111925;
  border:1px solid #1b2839;
  color:white;
  border-radius:25px;
  padding:13px 18px 13px 45px;
  outline:none;
}
.search input:focus{border-color:var(--blue)}
.search-icon{
  position:absolute;left:17px;top:13px;color:#8290a3
}

.account-btn{
  margin-left:auto;
  border:1px solid var(--line);
  background:#101824;
  color:white;
  border-radius:25px;
  padding:7px 12px 7px 7px;
  display:flex;
  align-items:center;
  gap:9px;
}
.avatar{
  width:35px;height:35px;
  border-radius:50%;
  background:#173b65;
  display:grid;
  place-items:center;
  font-weight:800;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}

.content{padding:28px}

.hero{
  min-height:290px;
  border-radius:22px;
  padding:38px;
  display:flex;
  align-items:flex-end;
  background:
    radial-gradient(circle at 80% 30%,rgba(22,131,255,.4),transparent 35%),
    linear-gradient(135deg,#102b4d,#09121f 60%,#071019);
  border:1px solid #173250;
  overflow:hidden;
}
.hero h1{font-size:44px;line-height:1.05;margin:10px 0}
.hero p{color:#aab7c8;max-width:560px;line-height:1.6}
.primary{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:25px;
  padding:12px 21px;
  font-weight:800;
}
.primary:hover{background:#3194ff}
.secondary{
  background:#172130;
  color:white;
  border:1px solid #27364a;
  border-radius:25px;
  padding:11px 18px;
}
.danger{
  background:transparent;
  color:#ff6d7b;
  border:1px solid #5b2630;
  border-radius:10px;
  padding:10px 15px;
}
.section{margin-top:30px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.section h2{margin:0;font-size:21px}
.muted{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:17px;
}
.card{
  background:#0c131e;
  border:1px solid #172232;
  border-radius:15px;
  padding:12px;
  transition:.18s;
}
.card:hover{transform:translateY(-2px);border-color:#28415f}
.cover{
  aspect-ratio:1;
  border-radius:11px;
  background:linear-gradient(135deg,#143458,#09111e);
  display:grid;
  place-items:center;
  overflow:hidden;
  margin-bottom:12px;
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-letter{font-size:40px;font-weight:900;color:#4da1ff}
.card-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:13px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.song-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:9px;
  border-radius:12px;
}
.song-row:hover{background:#101925}
.song-cover{
  width:50px;height:50px;border-radius:8px;
  background:#142235;
  overflow:hidden;
  flex:none;
}
.song-cover img{width:100%;height:100%;object-fit:cover}
.song-info{min-width:0;flex:1}
.song-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:13px;color:var(--muted);margin-top:3px}
.row-actions{display:flex;gap:7px}
.circle-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid #26364a;background:#121c29;color:white;
  display:grid;place-items:center;
}
.circle-btn:hover{background:var(--blue)}

.empty{
  border:1px dashed #26364a;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  border-radius:15px;
}

.page-title{font-size:30px;margin:0 0 7px}
.page-sub{color:var(--muted);margin:0 0 25px}

.panel{
  background:#0c131e;
  border:1px solid #192638;
  border-radius:17px;
  padding:22px;
  margin-bottom:18px;
}

.form{
  max-width:650px;
}
.field{margin-bottom:15px}
.field label{
  display:block;
  color:#b9c4d2;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
.field input,.field textarea,.field select{
  width:100%;
  background:#080e17;
  color:white;
  border:1px solid #243247;
  border-radius:10px;
  padding:12px;
  outline:none;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}

.auth-wrap{
  min-height:calc(100vh - 76px);
  display:grid;
  place-items:center;
}
.auth-box{
  width:min(460px,100%);
  background:#0d151f;
  border:1px solid #203047;
  border-radius:20px;
  padding:30px;
}
.auth-box h1{margin-top:0}
.auth-switch{
  color:#8fa0b6;
  text-align:center;
  margin-top:18px;
}
.link{
  color:#54a7ff;
  background:none;
  border:0;
  padding:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:13px;
}
.stat{
  background:#0a111b;
  border:1px solid #1a293b;
  padding:18px;
  border-radius:14px;
}
.stat-number{font-size:27px;font-weight:850}
.stat-label{font-size:13px;color:var(--muted);margin-top:5px}

.badge{
  width:20px;height:20px;
  display:inline-grid;
  place-items:center;
  background:#1683ff;
  color:white;
  border-radius:50%;
  font-size:12px;
  font-weight:900;
  vertical-align:middle;
  margin-left:6px;
}
.badge svg{width:12px;height:12px}

.profile-head{
  display:flex;
  gap:18px;
  align-items:center;
  margin-bottom:25px;
}
.big-avatar{
  width:90px;height:90px;border-radius:50%;
  background:#14365b;
  display:grid;place-items:center;
  font-size:30px;font-weight:900;
  overflow:hidden;
}
.big-avatar img{width:100%;height:100%;object-fit:cover}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
.plan{
  border:1px solid #203047;
  background:#0b131e;
  border-radius:17px;
  padding:22px;
}
.plan.featured{border-color:#1683ff;box-shadow:0 0 0 1px #1683ff22}
.price{font-size:29px;font-weight:900;margin:12px 0}
.plan ul{padding-left:18px;color:#a8b4c4;line-height:1.8}

.notice{
  padding:13px 15px;
  border-radius:10px;
  background:#0e2136;
  border:1px solid #1c4d78;
  color:#a9d4ff;
  margin-bottom:15px;
}
.error{
  padding:13px 15px;
  border-radius:10px;
  background:#28131a;
  border:1px solid #652531;
  color:#ffadb6;
  margin-bottom:15px;
}

.queue-item{
  border:1px solid #1c2b3d;
  border-radius:14px;
  padding:17px;
  margin-bottom:11px;
  background:#0a111a;
}
.queue-top{display:flex;align-items:center;gap:12px}
.queue-actions{display:flex;gap:8px;margin-top:13px}
.approve{
  background:#198754;color:white;border:0;border-radius:9px;padding:9px 14px;
}
.reject{
  background:#351720;color:#ff9ca8;border:1px solid #612631;border-radius:9px;padding:9px 14px;
}

.player{
  position:fixed;
  bottom:0;left:245px;right:0;
  height:88px;
  background:rgba(9,14,22,.97);
  border-top:1px solid #203047;
  z-index:30;
  display:flex;
  align-items:center;
  padding:12px 22px;
  gap:15px;
  backdrop-filter:blur(14px);
}
.now-cover{width:58px;height:58px;border-radius:8px;background:#142337;overflow:hidden}
.now-cover img{width:100%;height:100%;object-fit:cover}
.now-info{width:210px;min-width:0}
.player-controls{display:flex;align-items:center;gap:8px}
.play-main{width:43px;height:43px;border-radius:50%;border:0;background:white;color:#07101a}
.progress-wrap{flex:1;display:flex;align-items:center;gap:10px}
.progress{height:4px;background:#26364a;border-radius:5px;flex:1;cursor:pointer}
.progress-fill{height:100%;width:0;background:var(--blue);border-radius:5px}
.volume{width:100px}

.toast{
  position:fixed;
  right:22px;
  bottom:105px;
  background:#152131;
  border:1px solid #2c425d;
  color:white;
  padding:13px 17px;
  border-radius:11px;
  z-index:100;
  display:none;
  box-shadow:0 12px 30px #0007;
}

.mobile-menu{display:none}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .player{left:0}
  .mobile-menu{display:grid}
  .topbar{padding:0 15px}
  .content{padding:18px}
  .hero{padding:25px;min-height:260px}
  .hero h1{font-size:34px}
  .now-info{width:120px}
  .volume{display:none}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-mark">A</div>
    <span>Afrova</span>
  </div>

  <div class="nav">
    <div class="nav-title">DISCOVER</div>

    <button data-page="home" onclick="showPage('home')">
      <span class="icon">⌂</span> Home
    </button>

    <button data-page="search" onclick="showPage('search')">
      <span class="icon">⌕</span> Search
    </button>

    <button data-page="albums" onclick="showPage('albums')">
      <span class="icon">▣</span> Albums
    </button>

    <div class="nav-title">YOUR LIBRARY</div>

    <button data-page="library" onclick="showPage('library')">
      <span class="icon">♫</span> Library
    </button>

    <button data-page="liked" onclick="showPage('liked')">
      <span class="icon">♡</span> Liked Songs
    </button>

    <button data-page="playlists" onclick="showPage('playlists')">
      <span class="icon">☷</span> Playlists
    </button>

    <div class="nav-title">AFROVA</div>

    <button data-page="artist" onclick="showPage('artist')">
      <span class="icon">♬</span> Artist Studio
    </button>

    <button data-page="premium" onclick="showPage('premium')">
      <span class="icon">◆</span> Premium
    </button>

    <button data-page="account" onclick="showPage('account')">
      <span class="icon">○</span> Account
    </button>

    <button data-page="settings" onclick="showPage('settings')">
      <span class="icon">⚙</span> Settings
    </button>

    <button id="adminNav" data-page="admin" onclick="showPage('admin')" style="display:none">
      <span class="icon">▦</span> Admin Dashboard
    </button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <button class="circle-btn mobile-menu" onclick="toggleMenu()">☰</button>

  <div class="search">
    <span class="search-icon">⌕</span>
    <input id="globalSearch" placeholder="Search songs, artists, albums..." onkeydown="searchFromHeader(event)">
  </div>

  <button class="account-btn" onclick="showPage('account')" id="headerAccount">
    <div class="avatar" id="headerAvatar">A</div>
    <span id="headerName">Sign in</span>
  </button>
</header>

<div id="page" class="content"></div>

</main>
</div>

<div class="player" id="player">
  <div class="now-cover" id="nowCover"></div>
  <div class="now-info">
    <div class="song-title" id="nowTitle">Nothing playing</div>
    <div class="song-artist" id="nowArtist">Choose a song</div>
  </div>

  <div class="player-controls">
    <button class="circle-btn" onclick="previousSong()">‹</button>
    <button class="play-main" id="playButton" onclick="togglePlay()">▶</button>
    <button class="circle-btn" onclick="nextSong()">›</button>
  </div>

  <div class="progress-wrap">
    <span id="currentTime" class="muted">0:00</span>
    <div class="progress" onclick="seekAudio(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span id="duration" class="muted">0:00</span>
  </div>

  <input class="volume" type="range" min="0" max="1" step=".01" value=".8" onchange="audio.volume=this.value">

  <audio id="audio"></audio>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   AFROVA CONFIG
========================================================= */

const SUPABASE_URL = "https://eeurywspkbqbxayoyexi.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ajf06QZRdqJULjf9QOT-yw_6LCjkA86";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================================================
   PAYSTACK LINKS
========================================================= */

const PAYSTACK_LINKS = {
  student: "https://paystack.shop/pay/k0jf1wizby",
  individual: "https://paystack.shop/pay/w0ov-s1tir",
  duo: "https://paystack.shop/pay/7a78ikzfmy",
  family: "https://paystack.shop/pay/47wwryj73v"
};

/* =========================================================
   APP STATE
========================================================= */

let session = null;
let currentUser = null;
let currentProfile = null;
let currentArtist = null;
let currentSubscription = null;

let songs = [];
let artists = [];
let albums = [];
let currentPlaylist = [];
let currentIndex = -1;

const audio = document.getElementById("audio");

/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const n = String(name || "A").trim();
  return n.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.style.display="none",3000);
}

function errorBox(message){
  return `<div class="error">${esc(message)}</div>`;
}

function badge(){
  return `<span class="badge" title="Verified artist">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M7 12.5l3.1 3.1L17.5 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>`;
}

function coverHtml(url,title){
  if(url){
    return `<img src="${esc(url)}" alt="">`;
  }
  return `<div class="cover-letter">${esc((title||"A")[0].toUpperCase())}</div>`;
}

function formatTime(sec){
  if(!isFinite(sec)) return "0:00";
  sec=Math.floor(sec);
  return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}

function getEmailRedirectUrl(){
  return window.location.href.split("#")[0].split("?")[0];
}

function getPublicUrl(bucket,path){
  if(!path) return "";
  if(/^https?:\/\//i.test(path)) return path;
  return supabaseClient.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  const active=document.querySelector(`[data-page="${page}"]`);
  if(active) active.classList.add("active");

  document.getElementById("sidebar").classList.remove("open");

  if(page==="home") renderHome();
  else if(page==="search") renderSearch();
  else if(page==="albums") renderAlbums();
  else if(page==="library") renderLibrary();
  else if(page==="liked") renderLiked();
  else if(page==="playlists") renderPlaylists();
  else if(page==="artist") renderArtistStudio();
  else if(page==="premium") renderPremium();
  else if(page==="account") renderAccount();
  else if(page==="settings") renderSettings();
  else if(page==="admin") renderAdmin();
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* =========================================================
   AUTH
========================================================= */

async function loadCurrentUser(){
  const result=await supabaseClient.auth.getSession();
  session=result.data.session;
  currentUser=session?.user || null;

  if(!currentUser){
    currentProfile=null;
    currentArtist=null;
    currentSubscription=null;
    updateHeader();
    return;
  }

  let profileResult=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentProfile=profileResult.data;

  if(!currentProfile){
    await supabaseClient.from("profiles").insert({
      id:currentUser.id,
      display_name:currentUser.user_metadata?.display_name || currentUser.email?.split("@")[0] || "Afrova User",
      role:"listener"
    });

    const p=await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

    currentProfile=p.data;
  }

  const artistResult=await supabaseClient
    .from("artist_profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentArtist=artistResult.data;

  const subResult=await supabaseClient
    .from("subscriptions")
    .select("*")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  currentSubscription=subResult.data;

  updateHeader();
  updateAdminVisibility();
}

function updateHeader(){
  const name=document.getElementById("headerName");
  const avatar=document.getElementById("headerAvatar");

  if(currentUser){
    name.textContent=currentProfile?.display_name || currentUser.email?.split("@")[0] || "Account";
    avatar.textContent=initials(currentProfile?.display_name);
  }else{
    name.textContent="Sign in";
    avatar.textContent="A";
  }
}

function updateAdminVisibility(){
  const el=document.getElementById("adminNav");
  if(el) el.style.display=currentProfile?.role==="admin" ? "flex" : "none";
}

async function signUp(){
  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;

  if(!name || !email || !password){
    document.getElementById("authMessage").innerHTML=errorBox("Please fill in all fields.");
    return;
  }

  if(password.length<6){
    document.getElementById("authMessage").innerHTML=errorBox("Password must be at least 6 characters.");
    return;
  }

  const result=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{display_name:name},
      emailRedirectTo:getEmailRedirectUrl()
    }
  });

  if(result.error){
    document.getElementById("authMessage").innerHTML=errorBox(result.error.message);
    return;
  }

  document.getElementById("authMessage").innerHTML=
    `<div class="notice">Account created. Check your email and click the confirmation link to verify your Afrova account.</div>`;
}

async function signIn(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  const result=await supabaseClient.auth.signInWithPassword({email,password});

  if(result.error){
    document.getElementById("authMessage").innerHTML=errorBox(result.error.message);
    return;
  }

  await loadCurrentUser();
  toast("Welcome back to Afrova.");
  showPage("home");
}

async function resendConfirmation(){
  const email=document.getElementById("loginEmail")?.value.trim();

  if(!email){
    toast("Enter your email first.");
    return;

/* =========================================================
   PLAYER
========================================================= */

function playSong(song,index,playlist){
  currentPlaylist=playlist||songs;
  currentIndex=index;

  const url=getPublicUrl("music",song.audio_path);

  if(!url){
    toast("This song does not have an audio file yet.");
    return;
  }

  audio.src=url;
  audio.play().catch(()=>{});

  document.getElementById("nowTitle").textContent=song.title||"Unknown";
  document.getElementById("nowArtist").textContent="Afrova Artist";

  const cover=getPublicUrl("covers",song.cover_path);
  document.getElementById("nowCover").innerHTML=cover?`<img src="${esc(cover)}">`:`<div style="height:100%;display:grid;place-items:center;font-weight:900">${esc((song.title||"A")[0])}</div>`;

  document.getElementById("playButton").textContent="Ⅱ";

  recordStream(song);
}

async function recordStream(song){
  if(!currentUser || currentProfile?.role==="admin" || !song?.id) return;

  await supabaseClient.from("song_streams").insert({
    song_id:song.id,
    listener_id:currentUser.id
  });
}

function togglePlay(){
  if(!audio.src){
    toast("Choose a song first.");
    return;
  }

  if(audio.paused){
    audio.play();
    document.getElementById("playButton").textContent="Ⅱ";
  }else{
    audio.pause();
    document.getElementById("playButton").textContent="▶";
  }
}

function nextSong(){
  if(!currentPlaylist.length) return;
  currentIndex=(currentIndex+1)%currentPlaylist.length;
  playSong(currentPlaylist[currentIndex],currentIndex,currentPlaylist);
}

function previousSong(){
  if(!currentPlaylist.length) return;
  currentIndex=(currentIndex-1+currentPlaylist.length)%currentPlaylist.length;
  playSong(currentPlaylist[currentIndex],currentIndex,currentPlaylist);
}

function seekAudio(e){
  if(!audio.duration) return;
  const rect=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  audio.currentTime=pct*audio.duration;
}

audio.addEventListener("timeupdate",()=>{
  document.getElementById("currentTime").textContent=formatTime(audio.currentTime);
  document.getElementById("duration").textContent=formatTime(audio.duration);
  document.getElementById("progressFill").style.width=
    audio.duration ? ((audio.currentTime/audio.duration)*100)+"%" : "0%";
});

audio.addEventListener("ended",nextSong);

    <p class="page-sub">Upload a song to your Afrova Artist Studio.</p>

    <div class="panel form">
      <div class="field">
        <label>Song title</label>
        <input id="uploadTitle" placeholder="Song title">
      </div>

      <div class="field">
        <label>Genre</label>
        <input id="uploadGenre" placeholder="Afrobeats, R&B, Gospel...">
      </div>

      <div class="field">
        <label>Audio file</label>
        <input id="uploadAudio" type="file" accept="audio/*">
      </div>

      <div class="field">
        <label>Cover artwork</label>
        <input id="uploadCover" type="file" accept="image/*">
      </div>

      <button class="primary" onclick="uploadSong()">Upload Song</button>
      <button class="secondary" style="margin-left:7px" onclick="showPage('artist')">Cancel</button>
    </div>`;
}

async function uploadSong(){
  if(!currentUser || currentProfile?.role!=="artist"){
    toast("Artist access required.");
    return;
  }

  const title=document.getElementById("uploadTitle").value.trim();
  const genre=document.getElementById("uploadGenre").value.trim();
  const audioFile=document.getElementById("uploadAudio").files[0];
  const coverFile=document.getElementById("uploadCover").files[0];

  if(!title || !audioFile){
    toast("Song title and audio file are required.");
    return;
  }

  toast("Uploading...");

  const audioPath=currentUser.id+"/"+Date.now()+"-"+audioFile.name.replace(/\s+/g,"-");

  const audioUpload=await supabaseClient.storage
    .from("music")
    .upload(audioPath,audioFile,{upsert:false});

  if(audioUpload.error){
    toast(audioUpload.error.message);
    return;
  }

  let coverPath=null;

  if(coverFile){
    coverPath=currentUser.id+"/"+Date.now()+"-"+coverFile.name.replace(/\s+/g,"-");

    const coverUpload=await supabaseClient.storage
      .from("covers")
      .upload(coverPath,coverFile,{upsert:false});

    if(coverUpload.error){
      toast(coverUpload.error.message);
      return;
    }
  }

  const result=await supabaseClient
    .from("songs")
    .insert({
      artist_id:currentUser.id,
      title,
      audio_path:audioPath,
      cover_path:coverPath,
      genre,
      status:"pending"
    });

  if(result.error){
    toast(result.error.message);
    return;
  }

  toast("Song uploaded and sent for review.");
  showPage("artist");
}

}

async function getPendingArtists(){
  const result=await supabaseClient.rpc("get_pending_artist_applications");

}

async function reviewArtist(id,status){
  let note=null;

  if(status==="rejected"){
    note=prompt("Reason for rejection (optional):") || null;
  }

  const result=await supabaseClient.rpc("admin_review_artist",{
    requested_artist_id:id,
    requested_status:status,
    requested_note:note
  });

  if(result.error){
    toast(result.error.message);
    return;
  }

  toast(status==="approved" ? "Artist approved and verified." : "Artist application rejected.");
  await loadCurrentUser();
  renderAdmin();
}

/* =========================================================
   ARTIST PUBLIC PAGE
========================================================= */

async function openArtist(id){
  const artistResult=await supabaseClient
    .from("artist_profiles")
    .select("*")
    .eq("id",id)
    .single();

  const artist=artistResult.data;
  if(!artist) return;

  const profileResult=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",id)
    .maybeSingle();

  const statsResult=await supabaseClient.rpc("get_artist_stats",{
    requested_artist_ids:[id]
  });

  const songResult=await supabaseClient
    .from("songs")
    .select("*")
    .eq("artist_id",id)
    .eq("status","published")
    .order("created_at",{ascending:false});

  const verified=artist.verification_status==="approved";
  const stats=statsResult.data?.[0]||{followers:0,monthly_listeners:0,total_streams:0};
  const artistSongs=songResult.data||[];

  let followed=false;

  if(currentUser){
    const followResult=await supabaseClient
      .from("artist_follows")
      .select("id")
      .eq("artist_id",id)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    followed=!!followResult.data;
  }

  document.getElementById("page").innerHTML=`
    <button class="secondary" onclick="showPage('home')">← Back</button>

    <div class="panel" style="margin-top:18px">
      <div class="profile-head">
        <div class="big-avatar">
          ${artist.avatar_url?`<img src="${esc(artist.avatar_url)}">`:esc((artist.artist_name||"A")[0])}
        </div>

        <div style="flex:1">
          <div class="muted">Artist</div>
          <h1 style="margin:4px 0">${esc(artist.artist_name)}${verified?badge():""}</h1>
          <p class="muted">${esc(artist.bio||"")}</p>

          <button class="primary" onclick="toggleFollow('${id}',${followed})">
            ${followed?"Following":"Follow"}
          </button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-number">${Number(stats.monthly_listeners||0).toLocaleString()}</div>
          <div class="stat-label">Monthly listeners</div>
        </div>

        <div class="stat">
          <div class="stat-number">${Number(stats.total_streams||0).toLocaleString()}</div>
          <div class="stat-label">Total streams</div>
        </div>

        <div class="stat">
          <div class="stat-number">${Number(stats.followers||0).toLocaleString()}</div>
          <div class="stat-label">Followers</div>
        </div>
      </div>
    </div>

    <section class="section">
      <h2>Music</h2>
      <div class="panel">
        ${artistSongs.length
          ? artistSongs.map((s,i)=>songRow(s,i,artistSongs)).join("")
          : `<div class="empty">No published music yet.</div>`}
      </div>
    </section>`;
}

async function toggleFollow(artistId,currentlyFollowing){
  if(!currentUser){
    toast("Sign in to follow artists.");
    showPage("account");
    return;
  }

  if(currentlyFollowing){
    const result=await supabaseClient
      .from("artist_follows")
      .delete()
      .eq("artist_id",artistId)
      .eq("user_id",currentUser.id);

    if(result.error) toast(result.error.message);
  }else{
    const result=await supabaseClient
      .from("artist_follows")
      .insert({
        artist_id:artistId,
        user_id:currentUser.id
      });

    if(result.error) toast(result.error.message);
  }

  openArtist(artistId);
}
